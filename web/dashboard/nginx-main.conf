# Main nginx configuration for the unprivileged dashboard container (USER
# nobody). The stock main conf points pid/temp/log paths at /var and
# /var/run, which are not writable without root, so nginx crashes at
# startup ("mkdir /var/cache/nginx/client_temp failed"). All mutable
# state lives under /tmp; the server block is included from conf.d/.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
