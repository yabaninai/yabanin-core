# 8080, not 80: the container runs as USER nobody (NEXT-16) and cannot
# bind privileged ports on hosts with ip_unprivileged_port_start >= 1024.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to admin server
    location /api/ {
        proxy_pass http://admin:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Session, login, and CSRF live on the admin origin. The dashboard
    # fetches GET /auth/csrf with credentials so mutations can send
    # X-CSRF-Token (the CSRF cookie is HttpOnly).
    location /auth/ {
        proxy_pass http://admin:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
