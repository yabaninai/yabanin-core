name: Security Scan

on:
  schedule:
    # Every Monday at 07:00 UTC (after Dependabot runs)
    - cron: "0 7 * * 1"
  workflow_dispatch:

env:
  GO_VERSION: "1.27.x"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: [self-hosted, core-quality]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go (runner-local)
        run: |
          test -x /usr/local/go/bin/go
          /usr/local/go/bin/go version | grep -q 'go1\.27\.' ||
            { echo 'unexpected runner Go version' >&2; exit 1; }
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Prepare security tools and databases
        run: make install-analysis-tools security-tools-install security-db-update

      - name: Run govulncheck
        id: scan
        run: |
          set +e
          python3 scripts/quality/go_scope.py python3 scripts/security/go_vulnerability_disposition.py \
            --scanner "$(go env GOPATH)/bin/govulncheck" \
            --db "file://$HOME/.cache/yabanin-security/govuln" > govulncheck-output.log 2>&1
          status=$?
          set -e
          cat govulncheck-output.log
          {
            echo "output<<GOVULNCHECK_EOF"
            cat govulncheck-output.log
            echo "GOVULNCHECK_EOF"
          } >> "$GITHUB_OUTPUT"
          # TP-12: classify by govulncheck's exit-code contract (0 clean,
          # 3 findings, other = scanner error) instead of grepping the text.
          # The classifier exits with the honest outcome, so findings and
          # scanner errors fail this step instead of looking like a pass.
          scripts/security/govulncheck-classify.sh "$status" govulncheck-output.log

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-report
          path: |
            govulncheck-output.log
            artifacts/security/

      - name: Create security issue if vulnerabilities found
        if: always() && steps.scan.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          # Scanner output is DATA: passed through the environment, never
          # interpolated into the script source (TP-12).
          SCAN_OUTPUT: ${{ steps.scan.outputs.output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = process.env.SCAN_OUTPUT;

            // Sanitize for issue title and body
            const title = `Security Vulnerability Detected in Dependencies`;
            const sanitized = output
              .replace(/`/g, '\\`')
              .replace(/\n/g, '\n\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `A weekly security scan detected Go vulnerabilities:\n\n` +
                    '```\n' + sanitized + '\n```\n\n' +
                    `**Detected at:** ${new Date().toISOString()}\n\n` +
                    `Please review and remediate promptly.`,
              labels: ["security", "vulnerability"],
            });
