name: Deploy site

on:
  push:
    branches: [master, main]
    paths:
      - 'web/site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # pre-deploy guard reads this run's artifacts

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Single source of truth for the artifact name: upload-pages-artifact
  # `name`, deploy-pages `artifact_name` and the pre-deploy guard must agree.
  PAGES_ARTIFACT: github-pages

jobs:
  deploy:
    name: Build and publish GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/site/package-lock.json
      - name: Build
        working-directory: web/site
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/site/build
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Verify Pages artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/pages_artifact_guard.py
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
