name: Load Test (P7.1)

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6am UTC
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/static/release-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y k6

      - name: Start services
        run: docker compose -f deploy/docker-compose.yml up -d postgres redis gateway loggerd admin
        working-directory: deploy

      - name: Wait for ready
        run: sleep 30

      - name: Run chat load test
        run: |
          k6 run \
            --env TOKENROUTER_BASE_URL=http://localhost:8082 \
            --env TOKENROUTER_API_KEY=yabanin-dev-key \
            tests/load/k6_chat.js
        working-directory: deploy/../

      - name: Stop services
        if: always()
        run: docker compose -f deploy/docker-compose.yml down
