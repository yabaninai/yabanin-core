        "404":
          description: "Model not found (or not visible for this key)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Model list or whitelist check temporarily unavailable (fail-closed)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /yabanin/session-keys:
    post:
      summary: Mint a session key under the parent API key
      description: |
        AT-14: mints a short-lived `ybs_` session key bound to the parent
        API key. Only keys allowed to mint sessions may call this (403
        `session_mint_not_allowed` otherwise); mints are rate-limited to 60
        per minute per parent key (429 `rate_limited`). Labels are merged
        through the org label policy — rejected merges answer 400 with the
        policy's reject code and the dropped keys. The plaintext key is
        returned exactly once. Requires the database-backed deployment (501
        `session_keys_unavailable` otherwise).
      operationId: mintSessionKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionKeyMintRequest"
      responses:
        "201":
          description: Session key minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionKeyCreated"
        "400":
          description: "Malformed body (unknown fields rejected), invalid name/ttl/limits, or label policy rejection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "This key cannot mint session keys"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Session key mint rate exceeded (60/min per parent key)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Mint failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: "Session keys require a database (not wired in this deployment)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /yabanin/session-keys/{id}:
    delete:
      summary: Revoke a session key
      description: |
        Revokes the session key immediately (idempotent — revoking an
        already-revoked key is still 204). Only the minting parent key (or
        the session key itself) can see it; anything else is an
        indistinguishable 404 — no cross-tenant leakage.
      operationId: revokeSessionKey
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204":
          description: Revoked (or already revoked)
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Session key not found (or not visible for this key)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Revoke failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: "Session keys require a database (not wired in this deployment)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /yabanin/session-keys/{id}/finish:
    post:
      summary: Finish a session key with an outcome
      description: |
        Records the terminal outcome of the session (`success`, `failed` or
        `canceled`) plus optional exit code and duration, and revokes the
        key. Idempotent — finishing an already-finished key is 204 without
        changes. Same visibility boundary as revoke (404 otherwise).
      operationId: finishSessionKey
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionFinishRequest"
      responses:
        "204":
          description: Finished (or already finished)
        "400":
          description: "Malformed body or invalid status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Session key not found (or not visible for this key)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Finish failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: "Session keys require a database (not wired in this deployment)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /yabanin/session-keys/{id}/usage:
    get:
      summary: Usage totals for one session key
      description: |
        Aggregated request/token/cost totals plus per-model breakdown for the
        session key, from request logs (shadow traffic excluded). `complete`
        turns true once the session has been finished and settled for ≥10s —
        before that the totals may still grow. Same visibility boundary as
        revoke (404 otherwise).
      operationId: getSessionKeyUsage
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Usage totals (no groups on this endpoint)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageTotals"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Session key not found (or not visible for this key)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: "Session keys require a database (not wired in this deployment)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /yabanin/usage:
    get:
      summary: Usage totals for the calling API key
      description: |
        Aggregated request/token/cost totals for the parent API key over a
        time window (default: last 24h, at most 31 days), with optional
        `label.<key>=value` filters and `group_by` breakdown
        (`model` or `label:<key>`). Requires a key allowed to read usage
        (403 `usage_read_not_allowed` otherwise); session keys cannot call
        it. `complete` turns true once the window end is ≥10s in the past.
      operationId: getOwnUsage
      parameters:
        - name: from
          in: query
          required: false
          description: Window start (RFC3339; default now-24h).
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Window end, exclusive (RFC3339; default now).
          schema: {type: string, format: date-time}
        - name: group_by
          in: query
          required: false
          description: "Breakdown dimension: model or label:<key>."
          schema: {type: string}
        - name: label.<key>
          in: query
          required: false
          description: Exact-match label filters (repeatable, e.g. label.env=prod).
          schema: {type: string}
      responses:
        "200":
          description: Usage totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageTotals"
        "400":
          description: "Invalid from/to (must be RFC3339, window at most 31 days) or invalid label/group_by parameter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "This key cannot read usage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: "Session keys require a database (not wired in this deployment)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /yabanin/label-policy:
    get:
      summary: Effective org label policy
      description: |
        The org's compiled label policy as stored (allowed/denied/required
        keys, aliases, derive rules, rollup keys, limits); the default
        policy when none is configured. Determined by the org resolved from
        the API key.
      operationId: getLabelPolicy
      responses:
        "200":
          description: Label policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelPolicy"
        "401":
          description: "Missing/invalid API key or org resolution failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: "Session keys require a database (not wired in this deployment)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

