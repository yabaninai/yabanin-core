  /responses:
    post:
      summary: Create a response (OpenAI Responses-compatible)
      description: |
        OpenAI Responses API surface. Adapted path (default): the request is
        translated to the gateway's chat-completions pipeline and the result
        is translated back into a Responses envelope — `stream: true` yields
        the Responses SSE event sequence. Fields the translation cannot
        represent are dropped and listed in the `X-Yabanin-Unsupported`
        response header; `prompt_cache_key` is reused as the session id for
        prompt-cache affinity when valid. Native path: providers configured
        as native Responses providers (orgs without deny tool policies) are
        forwarded byte-for-byte. The surface is stateless (R046 D1):
        `previous_response_id` is rejected with 400 on BOTH paths — resend
        the full conversation in `input` with `store=false`. Errors from the
        translation itself use the
        Responses error envelope (`{"error":{message,type,param,code}}` with
        explicit nulls); delegated pipeline errors use the gateway's OpenAI
        error envelope.
      operationId: createResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponsesRequest"
      responses:
        "200":
          description: Response (JSON) or Responses event stream (SSE)
          headers:
            X-Yabanin-Unsupported:
              description: Comma-separated Responses fields dropped by the translation (present only when something was dropped) — the drop is never silent (R046 D2).
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "400":
          description: "Malformed request, untranslatable Responses shape, or previous_response_id (stateless surface: resend the full history)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: "Org wallet exhausted or not configured (insufficient_credits / no_billing_setup)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Model not allowed for this key / residency policy violation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit or budget exceeded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "Upstream failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Budget or whitelist check unavailable (fail-closed)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

