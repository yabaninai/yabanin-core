      summary: List visible models
      description: |
        Enabled registry models plus routing aliases, filtered to what the
        presented key's whitelist allows. Default shape is the OpenAI list
        (`{"object":"list","data":[...]}`); sending an `anthropic-version`
        header switches to the Anthropic model-list shape
        (`{data:[{type,id,display_name,created_at}],has_more,first_id,last_id}`).
