          multipart/form-data:
            schema:
              type: object
              required: [model, file]
              properties:
                model: {type: string, description: Model name (routing alias or concrete model)}
                file:
                  type: string
                  format: binary
                  description: Audio file part.
                language: {type: string}
                prompt: {type: string}
                response_format: {type: string}
                temperature: {type: number}
