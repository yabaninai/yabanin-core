  /batches:
    post:
      summary: Create a batch (R048; org-scoped)
      description: |
        Submits a batch of chat-completions requests for asynchronous
        execution. The input must reference a previously uploaded file
        (`POST /v1/files` with purpose `batch`): an OpenAI-shaped JSONL
        where every line is `{"custom_id","method":"POST",
        "url":"/v1/chat/completions","body":{model,...}}` (streaming
        requests are refused explicitly). Limits (ratified R048 D3): max
        1000 requests per batch, 30-day retention. Lines execute through
        the same admission/reservation/settlement path as interactive
        traffic (ratified D4) and each line's result lands in an
        org-scoped output file; failed lines in an error file.
      operationId: createBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateRequest"
      responses:
        "200":
          description: The created batch (status validating)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchObject"
        "400":
          description: "Invalid batch file (bad JSONL, custom_id/method/url/model violations, streaming request, too many lines)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "input_file_id does not resolve for this org (foreign ids are indistinguishable from missing ones)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List batches (own org only)
      operationId: listBatches
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 100, maximum: 1000}
      responses:
        "200":
          description: Batch list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchListObject"

  /batches/{id}:
    get:
      summary: Retrieve a batch (status + request counts)
      description: "Org-scoped: a foreign batch id answers 404 (existence hidden)."
      operationId: retrieveBatch
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The batch object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchObject"
        "404":
          description: "Unknown or foreign batch id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /batches/{id}/cancel:
    post:
      summary: Cancel a batch (idempotent for cancellable states)
      description: |
        Repeated-cancel semantics: cancelling and
        already-cancelled batches return the same object with no second
        side effect; a terminal completed/failed/expired batch refuses
        with 409 batch_already_terminal. An in-progress batch flips to
        `cancelling` and the executor finalizes it between lines.
      operationId: cancelBatch
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The batch object (cancelling or cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchObject"
        "404":
          description: "Unknown or foreign batch id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "batch_already_terminal — the batch finished; it is never restarted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /batches/{id}/results:
    get:
      summary: Download the batch output (JSONL)
      description: |
        The output file of a finalized batch: one JSONL entry per
        successful line `{"id","custom_id","response":{status_code,
        request_id,body},"error":null}`. Failed lines live in the error
        file (batch object's error_file_id, via /files/{id}/content).
      operationId: retrieveBatchResults
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Output JSONL
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "404":
          description: "Unknown or foreign batch id, or the results file is gone (retention)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "results_not_ready — the batch has not reached a terminal state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /files:
    post:
      summary: Upload a file (multipart/form-data; R048)
      description: |
        Org-scoped file upload for the Batch API. Fields: `file` (the
        payload) and `purpose` (only `batch` is accepted for client
        uploads; result files are written by the gateway with internal
        purposes). Ratified limits (D3): 100 MiB per file (413 above),
        30-day retention. Storage backend is Postgres bytea (ratified D2).
      operationId: uploadFile
      requestBody:
