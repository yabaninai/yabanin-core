openapi: "3.0.3"
info:
  title: Yabanin API
  description: |
    OpenAI-compatible LLM gateway plus the admin control-plane API.

    Two service bases are involved:
    - **gateway** (default servers): inference — POST /v1/chat/completions,
      /v1/completions, /v1/responses, /v1/embeddings, /v1/images/generations,
      /v1/audio/speech, /v1/audio/transcriptions, /v1/rerank, /v1/moderations,
      /v1/realtime, POST /v1/messages (+/count_tokens, Anthropic-compatible),
      GET /v1/models, the /v1/yabanin session-key/usage/label-policy surface,
      GET /v1/healthz.
    - **admin** (path-level servers on /api/* paths): control plane — lineage, credits, analytics.

    The gateway /v1 surface is kept in lock-step with the walked gateway
    router by the drift gate `TestGatewayOpenAPIDrift` (pkg/gateway).

    Auth everywhere: `Authorization: Bearer <api-key>`.
  version: "1.0.0"
servers:
  - url: https://api.yabanin.io/v1
    description: Gateway (production)
  - url: http://localhost:8082/v1
    description: Gateway (local dev)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY

  schemas:
    Error:
      type: object
      description: OpenAI-compatible error envelope ({"error":{...}}).
      properties:
        error:
          type: object
          properties:
            message: {type: string}
            type: {type: string}
            param: {type: string, nullable: true}
            code: {type: string, nullable: true, description: "Stable machine code when present (unsupported_feature, key_expired, *_not_supported_for_provider, ...)"}

    Message:
      type: object
      required: [role, content]
      properties:
        role: {enum: [system, user, assistant, tool]}
        content: {type: string}

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model: {type: string, description: Model name (routing alias like "smart" or a concrete model)}
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        max_tokens: {type: integer, nullable: true}
        temperature: {type: number, default: 1.0}
        stream: {type: boolean, default: false, description: true = SSE stream of chunks}

    Usage:
      type: object
      properties:
        prompt_tokens: {type: integer}
        completion_tokens: {type: integer}
        total_tokens: {type: integer}
        cost_usd: {type: number, description: Estimated cost in USD}

    ChatCompletionResponse:
      type: object
      properties:
        id: {type: string}
        object: {type: string}
        created: {type: integer}
        model: {type: string}
        choices:
          type: array
          items:
            type: object
            properties:
              index: {type: integer}
              message:
                $ref: "#/components/schemas/Message"
              finish_reason: {type: string}
        usage:
          $ref: "#/components/schemas/Usage"

    MessageRequest:
      type: object
      required: [model, max_tokens, messages]
      properties:
        model: {type: string, description: Model name (routing alias or concrete model)}
        messages:
          type: array
          description: Anthropic message turns (user/assistant; tool_use and tool_result content blocks supported)
          items: {type: object}
        max_tokens: {type: integer}
        system:
          description: Anthropic system prompt — a plain string or an array of text blocks (optionally with cache_control)
          oneOf:
            - type: string
              description: Plain system prompt text.
            - type: array
              description: System as Anthropic text content blocks.
              items: {type: object}
        tools:
          type: array
          description: Tool definitions with input_schema
          items: {type: object}
        stream: {type: boolean, default: false, description: true = Anthropic SSE event stream}

    CompletionsRequest:
      type: object
      required: [model]
      description: Legacy OpenAI text completions. Unlisted OpenAI parameters pass through to the upstream verbatim.
      properties:
        model: {type: string, description: Model name (routing alias or concrete model)}
        prompt:
          description: Prompt text or array of prompts; shape is upstream-owned.
          oneOf:
            - type: string
            - type: array
              items: {}
        max_tokens: {type: integer, nullable: true}
        stream: {type: boolean, default: false, description: true = SSE stream of chunks}

    EmbeddingsRequest:
      type: object
      required: [model, input]
      description: OpenAI-compatible embeddings. Unlisted parameters (encoding_format, dimensions, ...) pass through verbatim.
      properties:
        model: {type: string}
        input:
          description: Text, array of texts, or tokenized input; shape is upstream-owned.
          oneOf:
            - type: string
            - type: array
              items: {}
        encoding_format: {type: string}
        dimensions: {type: integer, nullable: true}

    ImagesGenerationsRequest:
      type: object
      required: [model, prompt]
      description: OpenAI-compatible image generation (non-streaming only). n/size and every other OpenAI parameter are upstream-owned passthrough — no per-parameter validation.
      properties:
        model: {type: string}
        prompt: {type: string}
        n: {type: integer}
        size: {type: string}
        quality: {type: string}
        response_format: {type: string}

    SpeechRequest:
      type: object
      required: [model, input, voice]
      description: OpenAI-compatible text-to-speech (JSON in, binary audio out). Other OpenAI parameters (response_format, speed, ...) pass through verbatim.
      properties:
        model: {type: string}
        input: {type: string, description: Text to synthesize}
        voice: {type: string}
        stream:
          type: boolean
          default: false
          description: Must be false/absent — SSE audio streaming is rejected 400 unsupported_feature before any upstream call.

    ResponsesRequest:
      type: object
      required: [model]
      description: |
        OpenAI Responses API. The gateway translates the request to its
        chat-completions pipeline and translates the result back into a
        Responses envelope (SSE event stream when `stream: true`). Fields the
        translation cannot represent are dropped and reported in the
        `X-Yabanin-Unsupported` response header. Providers configured as native
        Responses providers (and orgs without deny tool policies) get a
        byte-for-byte upstream passthrough instead.
      properties:
        model: {type: string}
        input:
          description: string, message array or item array — translated to chat turns.
        instructions: {type: string}
        stream: {type: boolean, default: false}
        tools:
          type: array
          description: Tool definitions; shape follows the Responses API.
          items: {type: object}
        prompt_cache_key: {type: string, description: Reused as the session id for prompt-cache affinity when valid}

    FileObject:
      type: object
      description: R048 org-scoped stored file (Postgres bytea payload, ratified D2). expires_at is the 30-day retention horizon (ratified D3).
      properties:
        id: {type: string}
        object: {type: string, enum: [file]}
        bytes: {type: integer}
        created_at: {type: integer, description: Unix seconds}
        expires_at: {type: integer, description: Unix seconds retention horizon}
        filename: {type: string}
        purpose: {type: string, enum: [batch, batch.output, batch.error]}
        status: {type: string}

    FileListObject:
      type: object
      properties:
        object: {type: string, enum: [list]}
        data:
          type: array
          items:
            $ref: "#/components/schemas/FileObject"

    FileDeleteObject:
      type: object
      properties:
        id: {type: string}
        object: {type: string, enum: [file]}
        deleted: {type: boolean}

    BatchCreateRequest:
      type: object
      required: [input_file_id]
      description: Batch submission. The input file must be an org-owned purpose=batch JSONL of OpenAI-shaped request lines (custom_id/method/url/body). Only /v1/chat/completions bodies are supported; streaming requests are refused.
      properties:
        input_file_id: {type: string}
        endpoint: {type: string, default: /v1/chat/completions}
        metadata: {type: object, additionalProperties: true}

    BatchObject:
      type: object
      description: R048 batch job (Postgres claim/lease queue, ratified D1). Status lifecycle validating → in_progress → finalizing → completed | failed | cancelled | expired; cancelling is the cancel-requested intermediate state.
      properties:
        id: {type: string}
        object: {type: string, enum: [batch]}
        endpoint: {type: string}
        status: {type: string, enum: [validating, in_progress, finalizing, completed, failed, cancelling, cancelled, expired]}
        request_counts:
          type: object
          properties:
            total: {type: integer}
            completed: {type: integer}
            failed: {type: integer}
        input_file_id: {type: string}
        output_file_id: {type: string}
        error_file_id: {type: string}
        created_at: {type: integer, description: Unix seconds}
        expires_at: {type: integer, description: Unix seconds retention horizon}
        completed_at: {type: integer, description: Unix seconds, terminal state only}
        metadata: {type: object, additionalProperties: true}

    BatchListObject:
      type: object
      properties:
        object: {type: string, enum: [list]}
        data:
          type: array
          items:
            $ref: "#/components/schemas/BatchObject"

    ModelObject:
      type: object
      properties:
        id: {type: string}
        object: {type: string, example: model}
        created: {type: integer, description: Unix timestamp}
        owned_by: {type: string}

    ModelList:
      type: object
      properties:
        object: {type: string, example: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelObject"

    SessionKeyMintRequest:
      type: object
      description: Mints a short-lived session key under the parent API key. Unknown fields are rejected.
      properties:
        name: {type: string, description: "Pattern [A-Za-z0-9 ._:/-], at most 64 characters"}
        ttl_seconds: {type: integer, default: 7200, minimum: 60, maximum: 43200}
        labels:
          type: object
          additionalProperties: {type: string}
        lock_labels: {type: boolean, default: false, description: Locks the merged label set against later session-level overrides}
        max_tokens: {type: integer, nullable: true, minimum: 1, maximum: 10000000000}
        max_cost_usd: {type: number, nullable: true, exclusiveMinimum: 0, maximum: 1000000}

    SessionKeyCreated:
      type: object
      properties:
        id: {type: string}
        key: {type: string, description: "Plaintext ybs_ session key — shown exactly once"}
        expires_at: {type: string, description: RFC3339}
        labels:
          type: object
          additionalProperties: {type: string}
        dropped:
          type: array
          description: Label entries dropped by the org label policy.
          items:
            type: object
            properties:
              key: {type: string}
              reason: {type: string}

    SessionFinishRequest:
      type: object
      required: [status]
      properties:
        status: {enum: [success, failed, canceled]}
        exit_code: {type: integer, nullable: true}
        duration_ms: {type: integer, nullable: true}

    UsageTotals:
      type: object
      description: Aggregated usage over request logs (shadow traffic excluded). cost_usd sums priced requests only; unpriced_requests counts unknown_price/no_usage outcomes.
      properties:
        requests: {type: integer}
        tokens_in: {type: integer}
        tokens_out: {type: integer}
        cache_read_tokens: {type: integer}
        cost_usd: {type: number}
        unpriced_requests: {type: integer}
        by_model:
          type: array
          items:
            type: object
            properties:
              model: {type: string}
              requests: {type: integer}
              tokens_in: {type: integer}
              tokens_out: {type: integer}
              cost_usd: {type: number}
        complete: {type: boolean, description: true once the queried window has settled (closed ≥10s ago)}
        groups:
          type: array
          description: Present only when group_by is requested.
          items:
            type: object
            properties:
              value: {type: string, description: Model name or label value (empty when null)}
              requests: {type: integer}
              tokens_in: {type: integer}
              tokens_out: {type: integer}
              cost_usd: {type: number}

    DeriveRule:
      type: object
      properties:
        from: {type: string}
        regex: {type: string}
        to: {type: string}
        template: {type: string}

    LabelPolicy:
      type: object
      description: Effective org label policy (defaults when none is configured).
      properties:
        allowed_keys: {type: array, items: {type: string}}
        denied_keys: {type: array, items: {type: string}}
        required_keys: {type: array, items: {type: string}}
        on_invalid: {type: string}
        on_missing: {type: string}
        aliases:
          type: object
          additionalProperties: {type: string}
        derive:
          type: array
          items:
            $ref: "#/components/schemas/DeriveRule"
        rollup_keys: {type: array, items: {type: string}}
        max_labels: {type: integer}
        value_max_len: {type: integer}

    CreditBalance:
      type: object
      properties:
        org_id: {type: string}
        balance_cents: {type: integer}
        balance_usd: {type: number}
        updated_at: {type: string}

    TopUpRequest:
      type: object
      required: [amount_cents]
      properties:
        amount_cents: {type: integer, minimum: 1}
        invoice_ref: {type: string}

    TopUpResponse:
      type: object
      properties:
        status: {type: string, example: topped_up}
        org_id: {type: string}
        amount_cents: {type: integer}
        increase_usd: {type: number}

    LineageRecord:
      type: object
      description: Ed25519-signed per-request attestation of where inference ran.
      properties:
        request_id: {type: string}
        model: {type: string}
        region: {type: string}
        signed_at: {type: string}

    SavingsReport:
      type: object
      description: Cost/savings analytics (lab-benchmark-derived figures, not an SLA).
      additionalProperties: true

paths:
  /chat/completions:
    post:
      summary: Create chat completion (OpenAI-compatible)
      description: |
        Non-stream returns a single JSON completion. `stream: true` returns
        `text/event-stream` with OpenAI-style chunks terminated by `[DONE]`.
        Fail-closed semantics: 403 model not whitelisted / budget not configured,
        429 budget exceeded, 503 budget or whitelist datastore unavailable.
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Completion (JSON) or chunk stream (SSE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": {description: Model not allowed for this key, or team has no budget configured, $ref: "#/components/schemas/Error"}
        "429":
          description: "Team budget hard limit reached"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Budget or whitelist check unavailable (fail-closed)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /messages:
    post:
      summary: Create a message (Anthropic Messages-compatible)
      description: |
        Anthropic Messages endpoint for Claude Code and Anthropic SDK clients.
        Accepts an Anthropic Messages request (`model`, `messages`, `max_tokens`,
        optional `system`, `tools`, `stream`) and answers with an Anthropic
        envelope; errors use the Anthropic `{"type":"error",...}` shape.

        Routing: models whose provider is `anthropic` are served as a native
        byte-for-byte passthrough (headers `anthropic-version`/`anthropic-beta`
        forwarded, `x-api-key` upstream auth). Every other model takes the
        adapted path: the request is translated to an OpenAI-compatible chat
        call and the chat stream is translated back into Anthropic SSE events.

        Streaming (`stream: true`) emits the Anthropic SSE sequence
        (`message_start`, `content_block_start`/`content_block_delta`/
        `content_block_stop`, `message_delta`, `message_stop`, `ping`).

        Event semantics on interrupted streams (canonical asymmetry):
        - Native path: a client disconnect or mid-stream upstream break still
          records the request as completed; the partial token usage seen in
          `message_start`/`message_delta` is billed, and the termination reason
          (`client_cancel` vs completed) distinguishes who ended the stream.
        - Adapted path: the same interruption records the request as failed.

        Stream error shape (adapted path): a terminal `event: error` is the
        last SSE event; an open content block is closed with `content_block_stop`
        first so partial text renders correctly, while buffered tool calls that
        were never announced stay dropped. Native-path errors (non-200 or
        upstream `event: error`) pass through unchanged.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: Message (JSON) or Anthropic event stream (SSE)
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: "Malformed request (invalid_request_error) or organization policy denial (message prefixed [content_policy_violation])"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Model not allowed for this key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Team budget hard limit reached; also the upstream rate-limit passthrough (Retry-After forwarded)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Upstream api_error passthrough (status and body unchanged)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "Upstream unreachable or failed (gateway Anthropic envelope)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Upstream overloaded_error passthrough"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /messages/count_tokens:
    post:
      summary: Count tokens for a Messages request
      description: |
        Anthropic count-tokens endpoint. Served natively for `anthropic`
        models; other providers get a local estimate flagged
        `X-Yabanin-Estimated: true` (no upstream call).
      operationId: countMessageTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: Token count
          content:
            application/json:
              schema:
                type: object
                properties:
                  input_tokens: {type: integer}
        "400":
          description: "Malformed request body (model is required)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
        "429":
          description: "Upstream rate limit passthrough (Retry-After preserved)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "Upstream failure (api_error; x-should-retry hint)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rerank:
    post:
      summary: Rerank documents against a query (OpenAI-compatible passthrough)
      description: |
        R105 (ratified D1/D2/D3): forwards `{model, query, documents[]}` to the
        OpenAI-compat upstream `/v1/rerank` and relays the ranked results
        byte-identically. OpenAI-compat providers only — other providers are
        refused 400 `rerank_not_supported_for_provider`. Usage accounting is
        actual: provider tokens when the upstream reports a `usage` block,
        `no_usage` (zero tokens) otherwise; without a price row the cost stays
        `unknown_price` — never a fabricated estimate. Limits: 10 MiB request
        body (413), at most 512 documents (400), 64 MiB upstream response
        (502, never truncated).
      operationId: rerankDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, query, documents]
              properties:
                model: {type: string}
                query: {type: string}
                documents:
                  type: array
                  maxItems: 512
                  description: String or object documents; shape is upstream-owned.
                  items: {}
                top_n: {type: integer, nullable: true}
      responses:
        "200":
          description: Ranked results (upstream JSON passed through verbatim)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed request, missing fields, >512 documents, or provider not supported"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Model not allowed for this key / residency policy violation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit or budget exceeded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "Upstream failure or oversized upstream response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /moderations:
    post:
      summary: Moderate content (OpenAI-compatible passthrough)
      description: |
        R105 (ratified D1/D2/D3): forwards `{model, input}` to the OpenAI-compat
        upstream `/v1/moderations` and relays the categories/scores payload
        byte-identically. OpenAI-compat providers only — other providers are
        refused 400 `moderations_not_supported_for_provider`. OpenAI
        moderations carry no usage block: such responses account as zero
        tokens / `no_usage`; a provider-reported `usage` block bills as actual
        tokens with an explicit `unknown_price` when no price row exists.
        Limits: 10 MiB request body (413), input a non-empty string or an
        array of at most 256 items (400), 64 MiB upstream response (502).
      operationId: moderateContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: {type: string}
                input:
                  oneOf:
                    - type: string
                      description: Plain text to classify.
                    - type: array
                      maxItems: 256
                      description: Items to classify; shape is upstream-owned.
                      items: {}
      responses:
        "200":
          description: Moderation results (upstream JSON passed through verbatim)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed request, invalid input shape, >256 items, or provider not supported"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Model not allowed for this key / residency policy violation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit or budget exceeded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "Upstream failure or oversized upstream response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /realtime:
    post:
      summary: Realtime session (SSE-only proxy)
      description: |
        R105 (ratified D1/D3/D4): POST-only SSE session proxy. The request
        body is forwarded to the OpenAI-compat upstream `/v1/realtime`; the
        upstream event stream is relayed to the client byte-identically as
        `text/event-stream`. WebSocket transport is NOT supported in the
        first release — an upgrade request is refused 400
        `unsupported_feature` before any admission or upstream work. Usage
        accounting is actual (D3): the last usage-bearing SSE event
        (top-level `usage` or realtime `response.usage`) bills. A client
        disconnect mid-stream settles the consumed prefix with
        `client_cancel` — usage already reported by the upstream is never
        lost (G3 parity); an upstream break settles `upstream_error` and a
        stalled stream is aborted by the idle watchdog (`idle_timeout`).
        Limits: 10 MiB request body (413), 64 MiB relayed stream (aborted,
        never truncated), session bounded by the model's upstream timeout
        (5 min default fallback).
      operationId: createRealtimeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: {type: string}
                session:
                  type: object
                  description: Session configuration; shape is upstream-owned.
                input: {description: Session input; shape is upstream-owned.}
      responses:
        "200":
          description: Realtime event stream (SSE, relayed byte-identically)
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: "Malformed request, missing model, WebSocket upgrade (SSE-only), or provider not supported"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing/invalid API key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
