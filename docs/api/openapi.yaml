  /audio/transcriptions:
    post:
      summary: Transcribe audio (OpenAI-compatible)
      description: |
        R049 §4.2: multipart/form-data in, upstream JSON out
        byte-identically. The multipart stream is parsed without
        full-buffering beyond the 10 MiB gateway cap; admission runs on a
        metadata-only text projection — raw audio bytes are never persisted
        and egress guards scan the text fields only. The form is rebuilt with
        the model field rewritten to the resolved registry model name; every
        other field (language, prompt, response_format, temperature, ...)
        passes through verbatim. OpenAI-compat providers only — other
        providers are refused 400 `transcriptions_not_supported_for_provider`.
