  # ── BYOK provider credentials (W-BYOK-API; keys.manage group, gates in the
  #    mount: root or the org's keys.manage admins; plaintext keys are never
  #    returned — responses carry the key_last4 mask only) ─────────────────
  /api/orgs/{id}/provider-credentials:
    get:
      summary: List the org's provider credentials (key_last4 mask, never the plaintext)
      operationId: listOrgCredentials
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Credential list } }
    post:
      summary: Create a provider credential (name, provider, base_url, api_key 20..5000)
      operationId: createOrgCredential
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Credential created (masked) }
        "409": { description: A credential with this name already exists in the org }
  /api/orgs/{id}/provider-credentials/{credId}:
    put:
      summary: Update a provider credential (nil fields keep the stored value; api_key rotates)
      operationId: updateOrgCredential
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: credId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Credential updated (masked) }
        "409": { description: A credential with this name already exists in the org }
    delete:
      summary: Delete a provider credential
      operationId: deleteOrgCredential
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: credId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Credential deleted } }
  /api/orgs/{id}/provider-credentials/{credId}/test:
    post:
      summary: Test a credential with a one-shot GET {base_url}/models (5s budget, SSRF-guarded, 1/min per org)
      operationId: testOrgCredential
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: credId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "Test result: {ok, status, error?}" } }
  /api/orgs/{id}/provider-credentials/{credId}/models:
    post:
      summary: Discover the provider's model catalog with the stored key (one-shot GET {base_url}/models, parsed; 5s budget, SSRF-guarded, shares the 1/min-per-org test throttle)
      operationId: listOrgCredentialModels
      x-permission: org:keys.manage
      description: |
        Discovery-only snapshot of the upstream OpenAI-compatible {base_url}/models list,
        fetched server-side with the stored key (Bearer header; discovery supports
        openai-compat semantics only — anthropic x-api-key discovery is a documented
        limitation, manual entry stays the fallback). A 200 catalog is a snapshot at
        request time, NOT a verified-usability mark: nothing is written to any registry
        (verified is always false) and chat readiness is only proven by real gateway
        traffic. Refusal reasons are machine-readable and derived only from the upstream
        status/parse outcome (the upstream body is never echoed, the key never returned):
        models_list_unavailable (404, other non-2xx, or a 2xx body that does not parse),
        key_forbidden (upstream 403 — listing refused; chat traffic may still work),
        key_unauthorized (upstream 401 — rotate the key via the credential update),
        key_unavailable (no enabled stored key resolved for this credential),
        transport_error (unreachable/refused/timeout within the 5s budget).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: credId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Catalog snapshot {provider, base_url, count, data: [model-id], discovered: true, verified: false} or refusal {provider, count: 0, reason, status?, error?}" }
        "403": { description: Caller lacks keys.manage on the org }
        "404": { description: Unknown org or credential (a foreign org/credential is indistinguishable from a missing one) }
        "429": { description: Throttled (1/min per org, shared with the test endpoint) }
        "503": { description: Credential store not wired }

  # ── Policy pipelines (OP-0b; policies.manage group, gates in the mount:
  #    root or the org's policies.manage admins — policies are security
  #    objects: they deny/mask/rewrite traffic. YAML is validated
  #    syntactically here; full compilation happens gateway-side when a
  #    version is loaded) ──────────────────────────────────────────────────
  # ── Policy decision log (OP-9; policies.manage group, gate in the mount:
  #    read-only view of what the pipeline did — one row per evaluation the
  #    gateway attached to an event, content-free findings, 90d retention) ─
  /api/organizations/{id}/policy-decisions:
    get:
      summary: List the org's policy decision log (newest first; entity-scoped filters verdict/mode/policy/request/time; standard pagination envelope)
      operationId: listPolicyDecisions
      x-permission: org:policies.manage
      description: >
        Read-only view of what the policy pipeline did — one row per policy
        evaluation the gateway attached to an event (90-day retention;
        content-free: findings carry detector categories only, never payload
        content). The `entity` view selects the row family: the default
        `decisions` view lists individual evaluations newest-first
        (created_at DESC, id DESC); the `requests` view rolls the filtered
        evaluations up per distinct request and orders by most-recent
        activity first (last_seen_at DESC, request_id DESC), excluding
        evaluations that carried no request id. A `mode: shadow` row never
        reads as an applied action — a shadow verdict records what WOULD
        have happened; only enforce verdicts were applied. The dashboard
        deep-links into this surface through hash params, not query params
        (see docs/api/CONTRACT.md §10).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: entity, in: query, description: Row family; totals and pagination count evaluations (decisions) or distinct requests (requests), schema: { type: string, enum: [decisions, requests], default: decisions } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: verdict, in: query, description: Filter to one evaluation outcome (deny > mask > flag > allow resolution), schema: { type: string, enum: [allow, flag, mask, deny] } }
        - { name: mode, in: query, description: Filter shadow (would-have, never applied) or enforce (applied) evaluations, schema: { type: string, enum: [shadow, enforce] } }
        - { name: policy_id, in: query, description: Exact policy pipeline id the evaluation ran under (no FK — the log survives policy deletion), schema: { type: string } }
        - { name: policy_version, in: query, description: Exact evaluated policy version; 0 is a real value meaning the writer recorded no version, schema: { type: integer, minimum: 0, maximum: 2147483647 } }
        - { name: request_id, in: query, description: Exact request id (the join key with the request explorer); legacy evaluations with an empty request id never match, schema: { type: string } }
        - { name: step, in: query, description: Pipeline step name — matches decisions whose findings carry at least one finding with this step, schema: { type: string } }
        - { name: created_from, in: query, description: Inclusive lower bound on evaluation time (RFC3339), schema: { type: string, format: date-time } }
        - { name: created_to, in: query, description: Inclusive upper bound on evaluation time (RFC3339), schema: { type: string, format: date-time } }
      responses:
        "200":
          description: >
            Paginated envelope {data, pagination:{page, page_size, total,
            total_pages}}. `entity=decisions` rows: {id, org_id, request_id
            (empty string when the event carried none — legacy rows),
            policy_id, policy_version (0 = unknown), mode, verdict, findings,
            findings_valid, duration_ms, created_at}. `findings` is ALWAYS a
            JSON array of content-free finding objects {step, category,
            severity, span?, action}; `findings_valid` is false exactly when
            the stored record could not be decoded into that array (findings
            is then []) — a degraded legacy record must never read as a clean
            "nothing found" verdict. `entity=requests` rows: {request_id,
            evaluations, first_seen_at, last_seen_at}.
        "400": { description: Invalid filter — unknown entity/verdict/mode value, non-integer/negative/out-of-range policy_version, non-RFC3339 created_from/created_to, or created_from after created_to; the message names the field }
  /api/organizations/{id}/policies:
    get:
      summary: List the org's policy pipelines (rows only; use the detail endpoint for versions and attachments)
      operationId: listPolicyPipelines
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Policy pipeline list } }
    post:
      summary: Create a policy pipeline with its first version (draft; name unique per org)
      operationId: createPolicyPipeline
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Pipeline created (version 1, draft) }
        "400": { description: Invalid body or YAML failing the syntactic gate }
        "409": { description: A policy with this name already exists in the org }
  /api/organizations/{id}/policies/drift:
    get:
      summary: Report the DB-side drift status of every policy (managed / drift — edited past git after a reconcile / unmanaged — never reconciled; the content-level DB-vs-git diff and convergence live in `yb policies reconcile`, OP-10)
      operationId: getPolicyPipelinesDrift
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Drift report (per-policy status, latest version authorship, drift_count) } }
  /api/organizations/{id}/policies/validate:
    post:
      summary: Strict-validate a draft policy document with the SAME parser the store path runs (pkg/pipeline.ParsePolicy + Validate); never touches the store. Invalid documents answer 400 with the exact error text a create/update would produce, so the UI can validate at save time and rely on validate-200 ⟺ stores
      operationId: validatePolicyPipeline
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Valid (parsed name and mode echoed back) }
        "400": { description: Invalid — same error text as the save path }
  /api/organizations/{id}/policies/{policyId}:
    get:
      summary: Get one policy pipeline with its versions (newest first) and attachments (priority first)
      operationId: getPolicyPipeline
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: policyId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Pipeline detail } }
    put:
      summary: Update a pipeline (yaml appends a new draft version; enabled flips the mode flag; active_version activates; attachments replace-all). Optional "version" is the optimistic-concurrency token — the current_version the caller loaded; a stale token rejects the WHOLE body atomically with 409 + the live row (R070 D2, owner 2026-10-18)
      operationId: updatePolicyPipeline
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: policyId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Applied (the refreshed pipeline row; use GET for the full detail) }
        "400": { description: Nothing to update, or a payload field failed validation }
        "404": { description: Pipeline not found in this org (foreign orgs stay invisible) }
        "409": { description: "Stale version token: {error, current:{policy}} — the live pipeline row rides the body; nothing was applied" }
    delete:
      summary: Delete a policy pipeline (versions and attachments cascade)
      operationId: deletePolicyPipeline
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: policyId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Pipeline deleted } }

  #    root or the org's routing.manage admins — a rollout IS model choice for
  #    live traffic, the same sensitivity class the routing settings carry.
  #    Versioned rows (the policy-pipeline pattern): content changes APPEND
  #    immutable versions; active_version moves atomically in one transaction;
  #    enabled=false is the manual rollback and never touches an in-flight
  #    response — the model is pinned at routing time; percent is a whole
  #    number 1..99; the split is hash(session_id)%100, sticky per session) ──
  /api/organizations/{id}/canary-rollouts:
    get:
      summary: List the org's canary rollouts (rows only; use the detail endpoint for versions)
      operationId: listCanaryRollouts
      x-permission: org:routing.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "Canary rollout list: {data: [rollout rows], count}" } }
    post:
      summary: Create a canary rollout with version 1 (draft, detached — activating is the explicit PUT active_version step; name unique per org)
      operationId: createCanaryRollout
      x-permission: org:routing.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: "Rollout created: {rollout, versions: [version 1]}" }
        "400": { description: "Invalid body (name 1..256 chars; base and canary models must be non-empty and differ; percent a whole number 1..99)" }
        "409": { description: A rollout with this name already exists in the org }
  /api/organizations/{id}/canary-rollouts/{rolloutId}:
    get:
      summary: Get one canary rollout with its versions (newest first; a foreign rollout id is the same 404 as a missing one)
      operationId: getCanaryRollout
      x-permission: org:routing.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rolloutId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "Rollout detail: {rollout, versions}" } }
    put:
      summary: Update a canary rollout (base_model+canary_model+percent together append a new draft version; active_version activates atomically; enabled flips the attach flag — false is the manual rollback)
      operationId: updateCanaryRollout
      x-permission: org:routing.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rolloutId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Applied (the refreshed rollout row; use GET for the versions) }
        "400": { description: Nothing to update, a partial content triple, or a field failed validation }
        "404": { description: Rollout not found in this org (foreign orgs stay invisible) }
    delete:
      summary: Delete a canary rollout (versions cascade)
      operationId: deleteCanaryRollout
      x-permission: org:routing.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rolloutId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Rollout deleted } }
  /api/organizations/{id}/canary-rollouts/{rolloutId}/recommendation:
    get:
      summary: Measured rollout health for a human rollback decision (D3 evidence only — the system never rolls back by itself; arm shares and per-arm failure counts from request_logs over the window)
      operationId: getCanaryRolloutRecommendation
      x-permission: org:routing.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rolloutId, in: path, required: true, schema: { type: string } }
        - { name: window_hours, in: query, schema: { type: integer, default: 24, minimum: 1, maximum: 720 } }
      responses:
        "200": { description: "Evidence: {evidence: {rollout_id, window_hours, canary_total, canary_errors, base_total, base_errors, recommendation: hold|rollback-recommended}, action: manual}" }
        "404": { description: Rollout not found in this org }

  # ── Root-only: guard detector-pack lifecycle ─────────────
  #    Deployment-global activation record for guard detector packs
  #    (migration 0013 guard_pack_state, written only through the durable
  #    compare-and-swap in pkg/policystore). Activation stages + verifies the
  #    on-disk pack first; only a winning CAS publishes it, so exactly one
  #    concurrent activation wins and every loser gets 409 with the LIVE
  #    durable state. A store failure answers 5xx with the pack state
  #    unchanged (fail-closed). Unsigned local packs load freely;
  #    a DECLARED signature fails closed without a configured verifier.
  #    The env-based startup activation (YABANIN_GUARD_PACK_DIR /
  #    YABANIN_GUARD_ACTIVE_PACKS) is unchanged; this API is layered on top.
  /api/guard-packs/activate:
    post:
      summary: Verify, stage and activate one on-disk guard detector pack by id + version (durable CAS; no restart needed for consumers of the lifecycle)
      operationId: activateGuardPack
      x-permission: root
      responses:
        "200": { description: "Activated: {status: activated, active_version, previous_version} — the version identity is pack@version (multi-pack candidates join them)" }
        "400": { description: Invalid body (pack_id must be a single path component; version 1..128 characters) }
        "404": { description: Unknown pack (no manifest under the configured pack root) or unknown version (manifest declares a different pack_version) }
        "409": { description: "Conflict: the durable active version moved (another activation won — body carries {error, current: {active_version, previous_version}}), or the pack failed manifest/detector verification (fail-closed, nothing changed)" }
        "500": { description: Guard policy store failed; the pack state is unchanged }
        "503": { description: Guard pack lifecycle or pack directory not configured }
  /api/guard-packs/rollback:
    post:
      summary: Restore the previous active guard pack version through the same durable CAS (the lifecycle's staged-but-unactivated candidate is dropped)
      operationId: rollbackGuardPack
      x-permission: root
      responses:
        "200": { description: "Rolled back: {status: rolled_back, active_version, previous_version}" }
        "409": { description: "Conflict: the durable active version moved, no active pack, or no prior version to restore" }
        "500": { description: Guard policy store failed; the pack state is unchanged }
        "503": { description: Guard pack lifecycle not configured }

  #    the read + dry-run half of the pack surface. The
  #    status endpoint never restates per-replica runtime telemetry it cannot
  #    know (applied versions and gateway_guard_pack_watch_failures_total live
  #    in the gateway process's /metrics and adoption logs); it reports the
  #    durable requested state plus the same pack load check the runtime
  #    materialization performs, so the failure-relevant condition (an active
  #    version that no longer loads from disk) is visible to the operator.
  /api/guard-packs:
    get:
      summary: "List the on-disk guard pack inventory (one row per pack directory: declared identity or the reason it is not loadable) with the durable active/previous versions"
      operationId: listGuardPacks
      x-permission: root
      responses:
        "200": { description: "Inventory: {packs: [{dir, pack_id, pack_version, files, signature_declared, error?}], active_version, previous_version} — a broken pack directory is listed WITH its error, never hidden; active/previous are the durable requested versions (empty = built-in chain)" }
        "500": { description: Guard policy store failed, or the configured pack root is unreadable }
        "503": { description: Guard pack lifecycle or pack directory not configured }
  /api/guard-packs/status:
    get:
      summary: Durable guard pack state (requested active/previous versions, staged candidate of this process) plus the runtime load check over the active version
      operationId: getGuardPackStatus
      x-permission: root
      responses:
        "200": { description: "Status: {active_version, previous_version, updated_by, updated_at, staged_version, runtime: {active_pack_loadable, load_error?, check}} — the load check is the same manifest decode + SHA-256 verification + detector compile every replica's adoption performs; a load failure keeps replicas on the last known-good hook and counts in gateway_guard_pack_watch_failures_total (which this endpoint deliberately does not restate)" }
        "500": { description: Guard policy store failed }
        "503": { description: Guard pack lifecycle or pack directory not configured }
  /api/guard-packs/validate:
    post:
      summary: Dry-run the pack loader for one on-disk pack by id + version (manifest decode + SHA-256 file verification + detector compile) without staging or activating anything
      operationId: validateGuardPack
      x-permission: root
      responses:
        "200": { description: "Valid: {status: valid, pack_id, pack_version, digest, detectors} — identical verification semantics to the activate path's stage step, so a valid preview cannot pass where activation would fail" }
        "400": { description: Invalid body (pack_id must be a single path component; version 1..128 characters) }
        "404": { description: Unknown pack or version (same fail-closed identity checks as activate) }
        "409": { description: The pack failed verification (broken manifest/detectors, declared signature without a verifier, oversized file) }
        "503": { description: Guard pack lifecycle or pack directory not configured }
  /api/guard-packs/simulate:
    post:
      summary: Detect-only dry run — load one on-disk pack (full verification, no staging) and evaluate the posted sample text through the combined built-in + pack evaluator (audit-only semantics; findings carry offsets and detector identity, never actions or state changes)
      operationId: simulateGuardPack
      x-permission: root
      responses:
        "200": { description: "Simulated: {status: simulated, pack_id, pack_version, digest, total_findings, truncated, findings: [{detector, category, start, end, confidence}]} — the sample is scanned by the same chain a staged candidate runs with (built-ins first, pack detectors after); the findings array is capped at 100 with total_findings + truncated carrying the full count" }
        "400": { description: Invalid body (pack_id single path component; version 1..128 characters; body cap 128 KiB) }
        "404": { description: Unknown pack or version }
        "409": { description: The pack failed verification or the simulation could not run }
        "503": { description: Guard pack lifecycle or pack directory not configured }

  #    or the org's policies.manage admins — prompts are pipeline INPUTS (a
  #    judge prompt decides verdicts; partials are substituted into policy
  #    pipelines), the same sensitivity class as policies. Templates carry
  #    {{var}} / {{partials.name}} placeholders; edits APPEND immutable
  #    versions and the draft label follows the latest saved version; labels
  #    (draft|active|canary|custom) are movable pointers moved via the labels
  #    endpoint; names are ref-safe [A-Za-z0-9_.-]+ (the prompt_ref /
  #    partials token key)) ─────────────────────────────────────────────────
  /api/organizations/{id}/prompts:
    get:
      summary: List the org's prompts (rows only; use the detail endpoint for versions and labels)
      operationId: listPrompts
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "Prompt list: {data: [prompt rows], count}" } }
    post:
      summary: Create a prompt with version 1 and the draft binding (name unique per org, ref-safe [A-Za-z0-9_.-]+)
      operationId: createPrompt
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: "Prompt created: {prompt, versions: [version 1]}" }
        "400": { description: Invalid body (name grammar 1..256 chars, empty template, params not a JSON object) }
        "409": { description: A prompt with this name already exists in the org }
  /api/organizations/{id}/prompts/{promptId}:
    get:
      summary: Get one prompt with its versions (newest first) and label bindings
      operationId: getPrompt
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: promptId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Prompt detail: {prompt, versions, labels}" }
        "404": { description: Prompt not found in this org (foreign orgs stay invisible) }
    put:
      summary: Append a NEW immutable version (template + params) and move the draft label to it — never an in-place edit
      operationId: updatePrompt
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: promptId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Version appended: {prompt, versions: [the new version]}; use GET for the full detail" }
        "400": { description: Invalid body }
        "404": { description: Prompt not found in this org }
    delete:
      summary: Delete a prompt (versions and labels cascade)
      operationId: deletePrompt
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: promptId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Prompt deleted } }
  /api/organizations/{id}/prompts/{promptId}/labels:
    post:
      summary: Bind a label (draft|active|canary|custom) to a version (upsert — the previous binding of the same label moves)
      operationId: promotePromptLabel
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: promptId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Binding: {label: {prompt_id, org_id, label, version, updated_at}}" }
        "400": { description: Unknown label or version < 1 }
        "404": { description: Prompt or version not found in this org }
  /api/organizations/{id}/partials:
    get:
      summary: List the org's partials (name-ordered; bodies included — partials are prompt building blocks, not secrets)
      operationId: listPartials
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "Partial list: {data: [partial rows], count}" } }
    post:
      summary: Create a named partial (name unique per org, ref-safe [A-Za-z0-9_.-]+; body ≤ 64KB — the substitution step's limit)
      operationId: createPartial
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: "Partial created: {partial}" }
        "400": { description: Invalid body }
        "409": { description: A partial with this name already exists in the org }
  /api/organizations/{id}/partials/{partialName}:
    put:
      summary: Replace a partial's body (version bumps; consumers observe changes)
      operationId: updatePartial
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: partialName, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Partial updated: {partial}" }
        "400": { description: Invalid body }
        "404": { description: Partial not found in this org (foreign orgs stay invisible) }
    delete:
      summary: Delete a partial
      operationId: deletePartial
      x-permission: org:policies.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: partialName, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Partial deleted }
        "404": { description: Partial not found in this org }

