openapi: "3.0.3"
info:
  title: Yabanin Admin Control-Plane API
  version: "1.2.0"
  description: |
    Route inventory of the admin control plane (services/admin), kept in
    lock-step with the router by services/admin/handlers/routes_inventory_test.go:
    the test walks SetupRouter (chi.Walk) and fails on any route that is
    undocumented, stale, or served under a different permission middleware
    class than the `x-permission` value below.

    `x-permission` classes mirror the actual middleware chain:
    - `public` — no auth beyond the global chain (rate limit, body limit, security headers)
    - `session` — admin cookie session (ChiAuthMiddleware + CSRF)
    - `portal` — developer-portal session (PortalAuthMiddleware)
    - `service` — X-Admin-Key header auth (`/internal` read-only service API)
    - `root` — MustBeRoot (platform operator only)
    - `scim` — OP-13 SCIM bearer token (scimAuthMiddleware, `/scim/v2`);
      organization-scoped to the token's org
    - `org:<perm>` — RequireOrgPermission, org-scoped role permission
      (pkg/adminstore/permissions.go); root bypasses.

    Intentionally not inventoried here: GET /metrics (Prometheus,
    methodless registration). The DB-gated groups mount only with a live
    Postgres pool, so the no-DB lock-step walk cannot see them; the
    UI-reachable surfaces (org credit wallet + top-up, low-balance report,
    owner feedback list, org region routing) ARE inventoried below and
    locked to the fully-wired golden walk (dbGatedAdminRoutes in
    routes_inventory_test.go). Still golden-tracked without a spec surface:
    OIDC SSO, GET|PUT /api/orgs/{id}/resale-pricing, sovereign models,
    GET /api/regions, GET /api/feedback/export, template marketplace,
    retrain status.
servers:
  - url: https://admin.yabanin.io
  - url: http://localhost:9091

components:
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
    SecurityIncident:
      type: object
      required: [id, org_id, group_key, summary, severity, confidence, status, first_seen, last_seen, event_count, first_event_id, last_event_id, evidence]
      description: >-
        One folded finding of the E06-P01 security inbox. Evidence carries
        references to the source security events, never their content.
      properties:
        id: {type: string, format: uuid}
        org_id: {type: string, format: uuid}
        group_key: {type: string, description: Fingerprint of the finding class this incident groups}
        summary: {type: string, description: Latest folded event's human-readable summary}
        severity: {type: string, enum: [low, medium, high]}
        confidence: {type: number, format: double, description: Grouping quality, 0..1}
        status: {type: string, enum: [new, acknowledged, in_progress, resolved, dismissed]}
        assignee: {type: string, format: uuid, nullable: true, description: Operator member id, null when unassigned}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        event_count: {type: integer, format: int64, minimum: 1}
        first_event_id: {type: string, description: Source event id of the earliest folded event}
        last_event_id: {type: string, description: Source event id of the latest folded event}
        evidence:
          type: array
          description: References (not content) into the security-events journal
          items: {type: object, additionalProperties: true}
    FleetInstallation:
      type: object
      required: [org_id, deployment_id, state, revoked, caps, enrolled_at, caps_updated_at]
      description: >-
        One managed installation of the E03-P01 fleet registry: a licensed
        deployment contour of one org, its negotiated caps document and
        its lifecycle state. Revoked rows carry the EXPLICIT revoked
        marker (revoked=true, revoked_at, revocation_reason). The record
        holds no secrets by construction — revocation is punished at
        secret issuance, never by storing key material.
      properties:
        org_id: {type: string, description: The license org coordinate (TEXT, not a uuid)}
        deployment_id: {type: string, description: The licensed deployment contour identity}
        state: {type: string, enum: [enrolled, active, stale, revoked]}
        revoked: {type: boolean, description: Explicit terminality marker; true exactly when state is revoked}
        revoked_at: {type: string, format: date-time, nullable: true}
        revocation_reason: {type: string, description: Audit trail entry of the first revocation}
        caps:
          type: object
          required: [format_version, capabilities]
          properties:
            format_version: {type: string}
            capabilities: {type: array, items: {type: string}}
            unsupported: {type: array, items: {type: string}, description: Visible remainder of the negotiation, never silently dropped}
        enrolled_at: {type: string, format: date-time}
        caps_updated_at: {type: string, format: date-time}
        last_heartbeat_at: {type: string, format: date-time, nullable: true, description: Monotone liveness clock; absent until the first verified heartbeat}
    CreditBalance:
      type: object
      required: [org_id, balance_cents, balance_usd, updated_at]
      properties:
        org_id: {type: string}
        balance_cents: {type: integer, format: int64, description: whole cents; a wallet-less org answers 0}
        balance_usd: {type: number, format: double, description: 'balance_cents / 100, display only'}
        updated_at: {type: string, format: date-time, description: RFC3339 UTC}
    CreditTransaction:
      type: object
      required: [id, org_id, amount_cents, balance_after, type, created_at]
      properties:
        id: {type: integer, format: int64}
        org_id: {type: string}
        amount_cents: {type: integer, format: int64, description: 'positive=top-up, negative=deduction'}
        balance_after: {type: integer, format: int64, description: wallet balance in cents after this entry}
        type: {type: string, enum: [topup, usage]}
        request_id: {type: string, description: omitted when the entry carries no request}
        invoice_ref: {type: string, description: omitted when the entry carries no invoice}
        metadata: {type: object, additionalProperties: true, description: omitted when empty}
        amount_micro_usd: {type: integer, format: int64, description: exact signed micro-USD; omitted on rows written before AF-05 exact micro accounting — historical rows are never recalculated}
        created_at: {type: string, format: date-time}
    CreditTransactionsPage:
      type: object
      required: [org_id, limit, count, txns]
      properties:
        org_id: {type: string}
        limit: {type: integer, description: the applied page size}
        count: {type: integer, description: len(txns)}
        txns: {type: array, items: {$ref: "#/components/schemas/CreditTransaction"}, description: newest first}
    CreditTopUpRequest:
      type: object
      required: [amount_cents]
      properties:
        amount_cents: {type: integer, format: int64, minimum: 1, description: must be positive}
        invoice_ref: {type: string, description: optional, stored on the ledger row}
        reason: {type: string, description: operator motive; the X-Audit-Reason header is the fallback; a missing reason still journals the entry}
    CreditTopUpResponse:
      type: object
      required: [status, org_id, amount_cents, increase_usd]
      properties:
        status: {type: string, enum: [topped_up]}
        org_id: {type: string}
        amount_cents: {type: integer, format: int64, description: the applied increment}
        increase_usd: {type: number, format: double, description: amount_cents / 100}
    LowBalanceReport:
      type: object
      required: [threshold_cents, count, org_ids]
      properties:
        threshold_cents: {type: integer, format: int64, description: the applied threshold (default -500)}
        count: {type: integer, description: len(org_ids)}
        org_ids: {type: array, items: {type: string}, description: 'wallets below the threshold, balance ascending'}
    FeedbackEntry:
      type: object
      required: [id, org_id, request_id, prompt_hash, original_class, action, created_at]
      properties:
        id: {type: integer, format: int64}
        org_id: {type: string}
        request_id: {type: string}
        prompt_hash: {type: string, description: hashed prompt — never the raw text}
        original_class: {type: string}
        action: {type: string, enum: [thumbs_up, thumbs_down, regenerate]}
        created_at: {type: string, format: date-time}
    FeedbackPage:
      type: object
      required: [feedback, total, page, page_size]
      properties:
        feedback: {type: array, items: {$ref: "#/components/schemas/FeedbackEntry"}}
        total: {type: integer, format: int64, description: 'full filtered count, not the page size'}
        page: {type: integer}
        page_size: {type: integer, description: the applied page size}
    OrgRegionState:
      type: object
      required: [home_region, residency_pinned]
      properties:
        home_region: {type: string, description: '"sg" when no assignment row exists yet'}
        residency_pinned: {type: boolean}
    OrgRegionUpdate:
      type: object
      required: [home_region]
      properties:
        home_region: {type: string}
        residency_pinned: {type: boolean, description: pin the residency (default false)}

paths:
  # ── Public ────────────────────────────────────────────────────────────
  /health:
    get:
      summary: Admin process liveness probe
      operationId: adminHealth
      security: []
      x-permission: public
      responses: { "200": { description: OK } }
  /auth/login:
    get:
      summary: Admin console login page
      operationId: adminLoginPage
      security: []
      x-permission: public
      responses: { "200": { description: HTML login form } }
    post:
      summary: Submit admin credentials and start a session
      operationId: adminLogin
      security: []
      x-permission: public
      responses:
        "200": { description: Session cookie set }
        "401": { description: Invalid credentials }
        "429": { description: Login rate limit exceeded }
  /auth/logout:
    get:
      summary: End the admin session (GET compatibility path)
      operationId: adminLogoutGet
      security: []
      x-permission: public
      responses: { "200": { description: Session cleared } }
    post:
      summary: End the admin session (CSRF-validated form action)
      operationId: adminLogout
      security: []
      x-permission: public
      responses: { "200": { description: Session cleared } }
  /portal/login:
    get:
      summary: Developer portal OIDC login redirect
      operationId: portalLogin
      security: []
      x-permission: public
      responses: { "302": { description: Redirect to the OIDC provider } }
  /portal/callback:
    get:
      summary: Developer portal OIDC callback
      operationId: portalCallback
      security: []
      x-permission: public
      responses: { "302": { description: Redirect to the portal } }
  /portal:
    get:
      summary: Developer portal home page
      operationId: portalHome
      security: []
      x-permission: public
      responses: { "200": { description: HTML page } }
  /portal/keys:
    post:
      summary: Developer portal key creation form action
      operationId: portalCreateKeyPage
      security: []
      x-permission: public
      responses: { "200": { description: Key issued } }
  /portal/keys/{id}/revoke:
    post:
      summary: Developer portal key revoke form action
      operationId: portalRevokeKeyPage
      security: []
      x-permission: public
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Key revoked } }

  # ── Portal session ────────────────────────────────────────────────────
  /portal/logout:
    post:
      summary: End the portal session
      operationId: portalLogout
      x-permission: portal
      responses: { "200": { description: Session cleared } }
  /api/me:
    get:
      summary: Caller identity and org rights (portal session when enabled, admin session otherwise)
      operationId: me
      x-permission: portal
      responses: { "200": { description: Identity payload } }
  /api/me/keys:
    get:
      summary: List the developer's own API keys
      operationId: portalListKeys
      x-permission: portal
      responses: { "200": { description: Key list } }
    post:
      summary: Issue a new API key for the developer
      operationId: portalCreateKey
      x-permission: portal
      responses: { "201": { description: Key created } }
  /api/me/keys/{id}:
    delete:
      summary: Revoke one of the developer's own keys
      operationId: portalDeleteKey
      x-permission: portal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Key revoked } }

  # ── Admin session (dashboard) ─────────────────────────────────────────
  /api/me/password:
    post:
      summary: Change the caller's own password (revokes all older sessions)
      operationId: adminChangeMyPassword
      x-permission: session
      responses: { "200": { description: Password changed; a fresh session cookie is issued } }
  /api/me/onboarding:
    get:
      summary: Read the org onboarding progress flag (?org_id=)
      description: >-
        W-WELCOME. Org-scoped: reader+ membership on the target org (root
        bypasses, foreign org 403); the route middleware is RequireOrgRole,
        inventoried under the session class.
      operationId: adminMyOnboardingGet
      x-permission: session
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: "{org_id, completed, skipped}; a missing row is the zero state" } }
    post:
      summary: Mark org onboarding completed or skipped (?org_id=)
      description: >-
        W-WELCOME. Body {completed|skipped} — exactly one true; the flag only
        advances. The org target rides the query string (the route middleware
        resolves it before the body is read). Same org gate as the GET;
        audit-logged.
      operationId: adminMyOnboardingMark
      x-permission: session
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: Mark persisted (audit-logged) } }
  /auth/csrf:
    get:
      summary: Mint a CSRF token for the console session
      operationId: adminCSRF
      x-permission: session
      responses: { "200": { description: Token issued } }
  /api/version:
    get:
      summary: Build facts handshake (version, commit, api_level)
      operationId: adminVersion
      x-permission: session
      responses: { "200": { description: Build facts } }
  /api/client-config/{agent}:
    get:
      summary: Render a coding agent's gateway config server-side over pkg/clientconfig (R069 D2 — the single source of truth; the config field is byte-identical to the renderer output and the env NAME only, never a key value; unknown agent 404; labels outside the canonical grammar drop with a reason)
      operationId: getClientConfig
      x-permission: session
      parameters:
        - { name: agent, in: path, required: true, schema: { type: string, enum: [claude-code, codex, opencode] } }
        - { name: base_url, in: query, required: true, schema: { type: string, maxLength: 2048 }, description: The operator-entered gateway origin (absolute http(s) URL) }
        - { name: key_env, in: query, schema: { type: string, default: YABANIN_API_KEY }, description: Env var the client reads the gateway key from }
        - { name: model, in: query, schema: { type: string, maxLength: 256 }, description: Optional default model id }
        - { name: labels, in: query, schema: { type: string }, description: Scope labels in the canonical k=v,k=v form (invalid entries drop and ride dropped_labels) }
      responses:
        "200": { description: "Render payload {agent, format, path, config, key_env, dropped_labels?}" }
        "400": { description: Invalid base_url / key_env / model bound }
        "404": { description: Unknown agent (no renderer) }
  /:
    get:
      summary: Dashboard aggregate (stats, models, top orgs)
      operationId: dashboard
      x-permission: root
      responses: { "200": { description: Aggregate payload } }
  /api/entitlement/diagnostics:
    get:
      summary: Served license state (activation plane) for operator observability (E01-P05 W04-C02)
      description: >-
        Read-only root-only diagnostics: the 1:1 served license state —
        configured (a license file is armed), active / expired (grace) /
        hard_expired verdicts, org_id, features, seats (inert legacy
        metadata, I22 — never an account limit) and the verbatim expiry
        instant. Strictly observational: expiry never gates this endpoint —
        a hard-expired deployment still answers 200 with its dark snapshot.
        The handler plane never imports licensing;
        services/run adapts the license server onto the snapshot
        interface. Reads are audited.
      operationId: getEntitlementDiagnostics
      x-permission: root
      responses:
        "200":
          description: "Snapshot payload {configured, active, org_id, seats, features, expired, hard_expired, expires_at}"
        "401": { description: Admin session is missing or invalid }
        "403": { description: Caller is not root }
        "503": { description: Entitlement diagnostics not armed in this contour }

  # ── Internal service API (X-Admin-Key) ───────────────────────────────
  /internal/api-keys:
    get:
      summary: List one org's API keys (org_id mandatory)
      operationId: internalListAPIKeys
      x-permission: service
      responses: { "200": { description: Key list } }
  /internal/analytics/savings:
    get:
      summary: Org savings report for a bounded window
      operationId: internalSavings
      x-permission: service
      responses: { "200": { description: Savings report } }
  /internal/analytics/cost:
    get:
      summary: Org cost report for a bounded window
      operationId: internalCost
      x-permission: service
      responses: { "200": { description: Cost report } }

  # ── Org-scoped analytics (org:analytics.read) ─────────────────────────
  /api/analytics/stats:
    get:
      summary: Request log stats for the scoped org
      operationId: analyticsStats
      x-permission: org:analytics.read
      responses: { "200": { description: Stats } }
  /api/analytics/top-models:
    get:
      summary: Top models by request count
      operationId: analyticsTopModels
      x-permission: org:analytics.read
      responses: { "200": { description: Model counts } }
  /api/analytics/time-series:
    get:
      summary: Request time series
      operationId: analyticsTimeSeries
      x-permission: org:analytics.read
      responses: { "200": { description: Time series points } }
  /api/analytics/error-breakdown:
    get:
      summary: Error breakdown by type
      operationId: analyticsErrorBreakdown
      x-permission: org:analytics.read
      responses: { "200": { description: Error entries } }
  /api/analytics/tasks:
    get:
      summary: CTOR/task cost analytics
      operationId: analyticsTasks
      x-permission: org:analytics.read
      responses: { "200": { description: Task analytics report } }
  /api/analytics/latency:
    get:
      summary: Latency percentiles
      operationId: analyticsLatency
      x-permission: org:analytics.read
      responses: { "200": { description: Percentiles } }
  /api/analytics/recent-errors:
    get:
      summary: Recent error log entries
      operationId: analyticsRecentErrors
      x-permission: org:analytics.read
      responses: { "200": { description: Error entries } }
  /api/analytics/query:
    get:
      summary: Unified analytics query (dimensions and filters)
      operationId: analyticsQuery
      x-permission: org:analytics.read
      responses: { "200": { description: Query result } }
  /api/analytics/views:
    get:
      summary: List saved analytics views
      operationId: listAnalyticsViews
      x-permission: org:analytics.read
      responses: { "200": { description: Views } }
    post:
      summary: Save an analytics view
      operationId: createAnalyticsView
      x-permission: org:analytics.read
      responses: { "201": { description: View created } }
  /api/analytics/views/{id}:
    put:
      summary: Update a saved analytics view
      operationId: updateAnalyticsView
      x-permission: org:analytics.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: View updated } }
    delete:
      summary: Delete a saved analytics view
      operationId: deleteAnalyticsView
      x-permission: org:analytics.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: View deleted } }
  /api/analytics/label-keys:
    get:
      summary: Label key statistics for the scoped org
      operationId: analyticsLabelKeys
      x-permission: org:analytics.read
      responses: { "200": { description: Label key stats } }
  /api/label-policy:
    get:
      summary: Read the org label policy
      operationId: getLabelPolicy
      x-permission: org:analytics.read
      responses: { "200": { description: Policy } }
    put:
      summary: Replace the org label policy
      operationId: putLabelPolicy
      x-permission: org:policies.manage
      responses: { "200": { description: Policy saved } }
    delete:
      summary: Remove the org label policy
      operationId: deleteLabelPolicy
      x-permission: org:policies.manage
      responses: { "200": { description: Policy removed } }
  /api/label-policy/test:
    post:
      summary: Dry-run a label policy against sample labels
      operationId: testLabelPolicy
      x-permission: org:analytics.read
      responses: { "200": { description: Match results } }

  # ── API keys (org:keys.manage) ────────────────────────────────────────
  /api/api-keys:
    get:
      summary: List the org's API keys
      operationId: listAPIKeys
      x-permission: org:keys.manage
      responses: { "200": { description: Key list } }
    post:
      summary: Create an API key
      operationId: createAPIKey
      x-permission: org:keys.manage
      responses: { "201": { description: Key created } }
  /api/api-keys/{id}:
    get:
      summary: Get an API key
      operationId: getAPIKey
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Key } }
    put:
      summary: Enable or disable an API key
      operationId: updateAPIKeyActive
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Key updated } }
    delete:
      summary: Delete an API key
      operationId: deleteAPIKey
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Key deleted } }
  /api/api-keys/{id}/labels:
    put:
      summary: Update API key labels and label flags
      operationId: updateAPIKeyLabels
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Labels updated } }
  /api/api-keys/{id}/rotate:
    post:
      summary: Rotate an API key secret
      operationId: rotateAPIKey
      x-permission: org:keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: New secret issued } }

  # ── Agent keys (org:agent_keys.manage) ────────────────────────────────
  /api/agent-keys:
    get:
      summary: List the org's agent (yag_) keys
      operationId: listAgentKeys
      x-permission: org:agent_keys.manage
      responses: { "200": { description: Key list } }
    post:
      summary: Create an agent key
      operationId: createAgentKey
      x-permission: org:agent_keys.manage
      responses: { "201": { description: Key created } }
  /api/agent-keys/delegate:
    post:
      summary: Create a delegated child agent key
      operationId: createDelegatedAgentKey
      x-permission: org:agent_keys.manage
      responses: { "201": { description: Delegated key created } }
  /api/agent-keys/{id}:
    get:
      summary: Get an agent key
      operationId: getAgentKey
      x-permission: org:agent_keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Key } }
  /api/agent-keys/{id}/revoke:
    post:
      summary: Revoke an agent key and its children
      operationId: revokeAgentKey
      x-permission: org:agent_keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Key revoked } }
  /api/agent-keys/{id}/budget:
    get:
      summary: Get an agent's daily budget
      operationId: getAgentBudget
      x-permission: org:agent_keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Budget } }
    put:
      summary: Set an agent's daily budget
      operationId: upsertAgentBudget
      x-permission: org:agent_keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Budget saved } }
    delete:
      summary: Remove an agent's daily budget
      operationId: deleteAgentBudget
      x-permission: org:agent_keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Budget removed } }

  # ── Principal delegation chain (org:agent_keys.manage) ────────────────
  # an agent key authenticates but grants nothing. These routes
  # issue/list/revoke the bounded read-only permission subset a human
  # principal delegates to an agent/CI subject. Provenance (grantor →
  # subject + permission subset) is the delegation record itself;
  # requests.read_originals is never delegatable.
  /api/agent-keys/{id}/delegations:
    post:
      summary: Delegate a bounded permission subset to this agent/CI subject
      description: >-
        Issues one delegation (org, delegatable read-only permission subset,
        mandatory TTL ≤ 30 days) from the authenticated human principal.
        Every requested permission must be delegatable AND currently held by
        the grantor on the org. Foreign or missing key ids are the same 404.
      operationId: issuePrincipalDelegation
      x-permission: org:agent_keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Delegation issued }
        "400": { description: Invalid scope, TTL, or subject type }
        "403": { description: Grantor does not hold the requested permissions }
        "404": { description: Agent key not found in this org }
        "409": { description: Agent key is revoked }
    get:
      summary: List the delegation provenance for this agent/CI subject
      operationId: listPrincipalDelegations
      x-permission: org:agent_keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: org_id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: Delegation list (metadata only) } }
  /api/agent-keys/{id}/delegations/{delegationID}/revoke:
    post:
      summary: Revoke one delegation; denial cascades at the next evaluation
      description: >-
        Stamps revoked_at on a live delegation. Only the original grantor or
        the platform root may revoke; unknown or already-revoked ids are 404.
      operationId: revokePrincipalDelegation
      x-permission: org:agent_keys.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: delegationID, in: path, required: true, schema: { type: string } }
        - { name: org_id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Delegation revoked }
        "403": { description: Caller is neither the grantor nor root }
        "404": { description: Delegation not found }

  # ── Team budgets (org:budgets.manage) ─────────────────────────────────
  /api/teams/{id}/budget:
    get:
      summary: Get a team's monthly budget
      operationId: getTeamBudget
      x-permission: org:budgets.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Budget } }
    put:
      summary: Set a team's monthly budget
      operationId: upsertTeamBudget
      x-permission: org:budgets.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Budget saved } }
    delete:
      summary: Remove a team's monthly budget
      operationId: deleteTeamBudget
      x-permission: org:budgets.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Budget removed } }
  /api/organizations/{id}/team-budgets:
    get:
      summary: List a team budget summary for the org
      operationId: listOrgTeamBudgets
      x-permission: org:budgets.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Budget summaries } }

  /api/organizations/{id}/original-retention:
    get:
      summary: Read an organization's original-content retention setting
      description: >-
        Reads the nullable organization override and effective policy. An absent
        override inherits the platform default (off); therefore only processed
        content is retained unless explicitly enabled. Reading retained originals
        is a separate capability (`requests.read_originals`) and is not implied
        by this settings endpoint, root status, or org administration.
        Retention governs the 90-day hot window; afterwards records transfer
        to S3/Iceberg (PostgreSQL-only mode retains in the DB and nothing is
        deleted by age); archive retention is administrator-defined.
      operationId: getOrgOriginalRetention
      x-permission: org:org.update
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Explicit override and effective retention setting. `enabled` is null when inherited; `effective_enabled` is always resolved.
          content:
            application/json:
              schema:
                type: object
                required: [org_id, enabled, effective_enabled, inherited]
                properties:
                  org_id: { type: string }
                  enabled: { type: boolean, nullable: true, description: Null inherits the platform default }
                  effective_enabled: { type: boolean, description: Whether original content is retained }
                  inherited: { type: boolean }
        "400": { description: Invalid organization scope }
        "401": { description: Admin session is missing or invalid }
        "403": { description: Caller lacks org.update in this organization }
        "404": { description: Organization not found }
        "500": { description: Retention setting lookup failed }
        "503": { description: Retention settings unavailable }
    patch:
      summary: Set or inherit an organization's original-content retention setting
      description: >-
        Requires `org.update`. Set `enabled` to true to opt in, false to opt out,
        or null to inherit the platform default (off). Updates are audited. This
        changes retention only; it never grants permission to read original
        content. The separate `requests.read_originals` capability is not assigned
        to built-in roles. Retention governs the 90-day hot window; afterwards
        records transfer to S3/Iceberg (PostgreSQL-only mode retains in the DB
        and nothing is deleted by age); archive retention is administrator-defined.
        90 days is a tier boundary, never an age-based deletion deadline.
      operationId: updateOrgOriginalRetention
      x-permission: org:org.update
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean, nullable: true, description: Null inherits the platform default }
      responses:
        "200":
          description: Retention setting updated and audit event recorded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
              example: { status: ok }
        "400": { description: Invalid JSON, missing enabled, or enabled is not boolean/null }
        "401": { description: Admin session is missing or invalid }
        "403": { description: Caller lacks org.update in this organization }
        "404": { description: Organization not found }
        "500": { description: Retention setting update failed }
        "503": { description: Retention settings unavailable }

  # ── Security inbox (org:security.read) ──────────────────────────────────
  /api/organizations/{id}/security-inbox:
    get:
      summary: List the organization's security incidents, newest first
      description: >-
        E06-P01 unified security inbox. Incidents are folded findings: the
        projection groups security events per organization and keeps the
        newest summary, severity, confidence, the occurred_at range and the
        event count. Reads are audited. Operator status changes and
        assignment arrive via PATCH on the incident resource
        (org:security.manage).
      operationId: listOrgSecurityInbox
      x-permission: org:security.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Incidents, newest first; an organization without findings has an empty array
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SecurityIncident" }
        "400": { description: Organization id is not a valid UUID }
        "401": { description: Admin session is missing or invalid }
        "403": { description: Caller lacks security.read in this organization }
        "500": { description: Inbox read failed }
        "503": { description: Security inbox is unavailable }

  /api/organizations/{id}/security-inbox/{incident_id}:
    get:
      summary: Read one security incident of the organization
      description: >-
        Detail view of one folded incident. Unknown and foreign-organization
        incident ids are indistinguishable (404). Reads are audited.
      operationId: getOrgSecurityIncident
      x-permission: org:security.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: incident_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SecurityIncident" }
        "400": { description: Organization or incident id is not a valid UUID }
        "401": { description: Admin session is missing or invalid }
        "403": { description: Caller lacks security.read in this organization }
        "404": { description: Incident not found in this organization }
        "500": { description: Inbox read failed }
        "503": { description: Security inbox is unavailable }
    patch:
      summary: Change an incident's operator status and/or assignee
      description: >-
        E06-P01 W04-C02 operator write. The status state machine is
        new → acknowledged → in_progress → resolved | dismissed, with
        resolved/dismissed → acknowledged as reopen; a same-state patch is
        a legal no-op (200, nothing duplicated, nothing bumped). Absent
        fields are untouched; assignee null clears the assignment.
        Unknown and foreign-organization incident ids are
        indistinguishable (404). Every request is journaled (audit action
        security_inbox.patch: patched | noop | conflict | not_found);
        middleware denials are unjournaled like every org-permission
        route. Last-write-wins in v1: no If-Match/ETag optimistic
        concurrency (transition legality is still enforced server-side).
      operationId: patchOrgSecurityIncident
      x-permission: org:security.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: incident_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status:
                  type: string
                  enum: [new, acknowledged, in_progress, resolved, dismissed]
                assignee:
                  type: string
                  format: uuid
                  nullable: true
            example: { status: acknowledged }
      responses:
        "200":
          description: The incident after the patch (also for a same-state no-op)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SecurityIncident" }
        "400": { description: Malformed body, empty patch, unknown status word, or a non-uuid assignee }
        "401": { description: Admin session is missing or invalid }
        "403": { description: Caller lacks security.manage in this organization (org_admin only) }
        "404": { description: Incident not found in this organization }
        "409": { description: The requested status transition is not legal }
        "500": { description: Inbox patch failed }
        "503": { description: Security inbox is unavailable }

  # ── Fleet registry (root-only, read-only) ─────────────────────────────
  /api/organizations/{org_id}/fleet/installations:
    get:
      summary: List the org's managed installations (E03-P01 W04-C03)
      description: >-
        Read-only fleet-registry view. org_id is the LICENSE org
        coordinate (TEXT, the one enrollments and heartbeats are signed
        for), carried verbatim — not an adminstore uuid. Deterministic
        deployment_id order; a revoked installation is explicitly marked
        (state=revoked AND revoked=true with revoked_at and reason).
        Mutations do not exist on this plane: enrollment, heartbeats and
        revocation flow through their own signed seams. Reads are audited.
      operationId: listOrgFleetInstallations
      x-permission: root
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string }, description: License org coordinate }
      responses:
        "200":
          description: Installations in deterministic deployment_id order; an org without installations has an empty array
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FleetInstallation" }
        "400": { description: Org coordinate fails the registry's structural law }
        "401": { description: Admin session is missing or invalid }
        "403": { description: Caller is not root }
        "500": { description: Registry read failed }
        "503": { description: Fleet registry is unavailable }

  /api/organizations/{org_id}/fleet/installations/{deployment_id}:
    get:
      summary: Read one managed installation of the org
      description: >-
        Detail view of one deployment contour. Unknown and
        foreign-organization deployments are indistinguishable (404).
        Reads are audited.
      operationId: getOrgFleetInstallation
      x-permission: root
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string }, description: License org coordinate }
        - { name: deployment_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The installation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FleetInstallation" }
        "400": { description: Org or deployment coordinate fails the registry's structural law }
        "401": { description: Admin session is missing or invalid }
        "403": { description: Caller is not root }
        "404": { description: Installation not found in this organization }
        "500": { description: Registry read failed }
        "503": { description: Fleet registry is unavailable }

  # ── Members & developers (org:members.manage) ─────────────────────────
  /api/organizations/{id}/members:
    get:
      summary: List org members with roles
      operationId: listOrgMembers
      x-permission: org:members.manage
