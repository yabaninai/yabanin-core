      responses: { "200": { description: Member removed } }
  # ── Member invitations (W-INV, org:members.manage; public acceptance page below)
  /api/organizations/{id}/members/invites:
    get:
      summary: List pending member invitations
      operationId: listMemberInvites
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Pending invitations } }
  /api/organizations/{id}/members/invite:
    post:
      summary: Invite a member by email (returns the one-time link)
      operationId: createMemberInvite
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Invitation created with the one-time invite path }
        "409": { description: Duplicate active invite or already a member }
  /api/organizations/{id}/members/invites/{inviteID}/resend:
    post:
      summary: Rotate an invitation's token and restart its 72h window
      operationId: resendMemberInvite
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: inviteID, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Fresh one-time invite path }
        "410": { description: Invite already accepted }
  /api/organizations/{id}/members/invites/{inviteID}/revoke:
    post:
      summary: Revoke a pending invitation
      operationId: revokeMemberInvite
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: inviteID, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Invitation revoked }
        "410": { description: Invite already accepted }

  /api/organizations/{id}/scim/tokens:
    get:
      summary: List the org's SCIM bearer tokens (metadata only, never the secret)
      operationId: listScimTokens
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Token records (metadata only) } }
    post:
      summary: Issue a SCIM bearer token (the raw token is returned exactly once)
      operationId: createScimToken
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Token created; body carries the raw scim_ token once }
  /api/organizations/{id}/scim/tokens/{tokenID}:
    delete:
      summary: Revoke a SCIM bearer token (immediate 401 on /scim/v2)
      operationId: revokeScimToken
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: tokenID, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Token revoked }
        "404": { description: Unknown token (or another org's token) }

  /scim/v2/ServiceProviderConfig:
    get:
      summary: SCIM service-provider discovery document
      operationId: scimServiceProviderConfig
      x-permission: scim
      responses: { "200": { description: ServiceProviderConfig resource } }
  /scim/v2/Schemas:
    get:
      summary: SCIM schema discovery (supported User/Group subset; userName immutable, password writeOnly+ignored)
      operationId: scimSchemas
      x-permission: scim
      responses: { "200": { description: ListResponse of Schema resources } }
  /scim/v2/ResourceTypes:
    get:
      summary: SCIM resource-type discovery (User and Group, no extensions)
      operationId: scimResourceTypes
      x-permission: scim
      responses: { "200": { description: ListResponse of ResourceType resources } }
  /scim/v2/Users:
    get:
      summary: List SCIM users of the token's org (filter userName eq supported; startIndex/count pagination)
      operationId: scimListUsers
      x-permission: scim
      responses: { "200": { description: ListResponse of User resources } }
    post:
      summary: Provision a SCIM user (idempotent — existing userName/externalId returns the existing resource)
      operationId: scimCreateUser
      x-permission: scim
      responses:
        "201": { description: User created (membership with the default role) }
        "200": { description: User already exists (no duplicate) }
  /scim/v2/Users/{id}:
    get:
      summary: Fetch one SCIM user
      operationId: scimGetUser
      x-permission: scim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: User resource }
        "404": { description: Unknown id (or another org's user) }
    put:
      summary: Sync a SCIM user's profile (userName immutable)
      operationId: scimPutUser
      x-permission: scim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: User synced }
        "400": { description: userName mutation refused }
    patch:
      summary: Attribute-level sync (active, name fields; Okta/Entra profiles)
      operationId: scimPatchUser
      x-permission: scim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: User synced }
        "400": { description: Unsupported operation (e.g. userName mutation) }
    delete:
      summary: Deactivate a SCIM user (the account is never hard-deleted)
      operationId: scimDeleteUser
      x-permission: scim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: User deactivated }
        "404": { description: Unknown id (or another org's user) }
  /scim/v2/Groups:
    get:
      summary: List role groups of the token's org with their SCIM members (startIndex/count pagination; deactivated members never listed)
      operationId: scimListGroups
      x-permission: scim
      responses: { "200": { description: ListResponse of Group resources } }
    post:
      summary: Resolve a group displayName to a role group (idempotent 201)
      operationId: scimCreateGroup
      x-permission: scim
      responses:
        "201": { description: Role group resource }
        "400": { description: displayName does not map to an org role }
  /scim/v2/Groups/{id}:
    get:
      summary: Fetch one role group with its members
      operationId: scimGetGroup
      x-permission: scim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Group resource }
        "404": { description: Unknown role group }
    patch:
      summary: Add/remove members (memberships in the token org with the group's role)
      operationId: scimPatchGroup
      x-permission: scim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Group resource after the change }
        "404": { description: Member is not a user of this organization }
    delete:
      summary: Strip the role from all members in the org (the role group itself persists)
      operationId: scimDeleteGroup
      x-permission: scim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Memberships removed }
        "404": { description: Unknown role group }
  /invite/{token}:
    get:
      summary: Public member-invitation acceptance page
      operationId: memberInvitePage
      security: []
      x-permission: public
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: HTML acceptance form }
        "404": { description: Unknown or revoked invitation token }
        "410": { description: Expired or already accepted invitation }
    post:
      summary: Accept a member invitation (form post)
      operationId: memberInviteAccept
      security: []
      x-permission: public
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Invitation accepted }
        "401": { description: Invalid credentials for an existing account }
        "404": { description: Unknown or revoked invitation token }
        "410": { description: Expired or already accepted invitation }
  /api/organizations/{id}/developers:
    get:
      summary: List portal developers of the org
      operationId: listDevelopers
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Developers } }
    post:
      summary: Invite a portal developer
      operationId: createDeveloper
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "201": { description: Developer created } }
  /api/organizations/{id}/developers/{userID}:
    put:
      summary: Update a portal developer
      operationId: updateDeveloper
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: userID, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Developer updated } }
    delete:
      summary: Deactivate a portal developer
      operationId: deleteDeveloper
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: userID, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Developer deactivated } }

  # ── Request explorer (org:requests.read) ──────────────────────────────
  /api/organizations/{id}/requests:
    get:
      summary: Unified request explorer list
      operationId: listOrgRequests
      x-permission: org:requests.read
      description: >
        Paginated envelope {data, pagination:{page, page_size, total,
        total_pages}}; newest first. This endpoint and the /stats endpoint
        share one query-filter parser, so they always accept the same filter
        surface. `rule_id` narrows to requests whose stored routing decision
        names that routing rule (the `rule` identity triple inside the
        row's `routing_decision` field — see docs/api/CONTRACT.md §10 for
        the reserved envelope vocabulary). The dashboard deep-links here via
        `#requests-explorer?org=…&inspect=request:<id>` (hash params, again
        §10).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rule_id, in: query, description: Routing-rule identity filter (routing_rules.id); STRICT uuid — a malformed value is a 400 naming the field, never a silently ignored filter, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Request rows }
        "400": { description: Malformed rule_id (not a uuid) or invalid time filter }
  /api/organizations/{id}/requests/stats:
    get:
      summary: Request list statistics for the org
      operationId: orgRequestStats
      x-permission: org:requests.read
      description: >
        Aggregates over the SAME filters as the list endpoint (shared parser,
        including rule_id), so the stats block always describes exactly what
        the table shows.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rule_id, in: query, description: Routing-rule identity filter; strict uuid — malformed values are a 400, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Stats }
        "400": { description: Malformed rule_id (not a uuid) or invalid time filter }
  /api/organizations/{id}/requests/export:
    get:
      summary: Stream request history as JSON Lines
      operationId: exportOrgRequests
      description: >
        Exports filtered request history from the hot request_logs store. Payload fields require the same owner/grant/role matrix as request detail; original payload scope additionally requires effective original retention.
        Grant refusal/replay contract : every denial that happens before the 200 stream starts (400/403/413/500/503) leaves a redeemed one-time payload grant unconsumed and returns no payload bytes — with one rare audited edge (C1) where a 403 answers after the consume already committed; see the 403 response. The atomic consume is the last step before the 200 commit and the grant is never restored. Once the 200 stream has begun, the attempt is final: any stream failure (X-Export-Error trailer) leaves the grant consumed even if only a partial prefix was delivered — partial data is never re-served and no automatic refund exists. The grant is single-use across BOTH redemption surfaces (this export and the request detail endpoint): replaying a consumed grant on either surface returns the same generic 403 as an unknown grant (no consume/no-consume oracle) — the detail endpoint follows this identical refusal/replay contract .
      x-permission: org:requests.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, schema: { type: string } }
        - { name: query, in: query, description: YQL request filter, schema: { type: string } }
        - { name: request_id, in: query, description: Required when redeeming a request-bound payload grant, schema: { type: string } }
        - { name: payload_grant, in: query, description: Single-use bearer grant; alternatively send X-Request-Payload-Grant, schema: { type: string } }
        - { name: scope, in: query, description: Grant scope; originals require effective retention, schema: { type: string, enum: [payload.read, payload.read_originals] } }
      responses:
        "200":
          description: >
            JSONL stream. Once this response has been committed the attempt is final for a redeemed grant: a stream that ends abnormally delivers the partial JSONL prefix plus the X-Export-Error trailer and the grant stays consumed (no refund, no re-serve). Every decision, allowed or denied, is journalled.
          headers:
            X-Export-Error:
              description: >
                Trailer (announced via the Trailer header) present only when the
                stream ends abnormally after the 200 was committed. One of:
                row_limit (the store walk exceeded the 1000-row cap mid-stream),
                byte_limit (emitted bytes exceeded the 10 MiB cap),
                write_error (the client transport failed; usually undeliverable),
                store_error (the store walk failed mid-stream).
              schema: { type: string, enum: [row_limit, byte_limit, write_error, store_error] }
        "400": { description: Invalid filter, missing request_id for a payload grant, or invalid grant scope; a payload grant is not consumed }
        "403":
          description: >
            Fail-closed denial, one of: request history access denied (content
            policy), the payload grant cannot be used (non-root caller or
            deny-own-history policy), original payload retention is disabled
            (payload.read_originals), or the payload grant is invalid,
            expired, revoked, wrong-scope, bound to a different request or
            organization, already consumed, or the grant store is unavailable.
            Invalid and consumed grants are deliberately indistinguishable
            (same generic body, no oracle). No denial here consumes the grant
            and none returns payload bytes, with one rare audited edge (C1):
            the atomic consume commits first and the mandatory
            request_payload.grant_used audit insert runs afterwards — if that
            insert fails, the store reports an error and this same generic
            403 answers while the grant is already spent. Replay stays safe:
            the spent token keeps answering this same generic 403 (no oracle,
            no payload bytes), so redemption can only be retried with a fresh
            grant. Every denial is journalled.
        "413":
          description: >
            Pre-stream row-cap rejection: the pre-flight count exceeds 1000
            rows. No JSONL response has begun and a payload grant is NOT
            consumed. The mid-stream byte cap is never a 413 — it ends the
            committed 200 stream with the X-Export-Error: byte_limit trailer.
        "500":
          description: >
            Request store failure before the stream starts (the pre-flight
            count). Answered as 500 with a JSON error body; no JSONL response
            has begun, no trailer is involved, and a payload grant is NOT
            consumed — the redemption may be retried once the store recovers.
        "503": { description: Request store, export stream, or retention setting unavailable; a payload grant is not consumed }
  /api/organizations/{id}/requests/archive-search:
    get:
      summary: Search request history through the unified payload matrix
      operationId: searchOrgRequestArchive
      description: Archive is not materialized yet. This endpoint currently searches hot request_logs; the future archive zone is planned with N10.
      x-permission: org:requests.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: query, in: query, description: YQL request filter, schema: { type: string } }
      responses:
        "200": { description: Matching rows with source=hot }
        "400": { description: Invalid filter or YQL expression }
        "403": { description: Request history access denied (content policy) }
        "500": { description: Archive search store error }
        "503": { description: Archive search is unavailable }
  /api/organizations/{id}/requests/{request_id}:
    get:
      summary: Full request detail with stored response snapshot
      operationId: orgRequestDetail
      description: >
        Returns one request row with its stored response snapshot. Payload
        fields require the same owner/grant/role matrix as the export;
        original payload scope additionally requires effective original
        retention. A request without a payload grant token is the everyday
        metadata-only read and never consumes anything.
        Grant refusal/replay contract (
        identical to the export endpoint): every non-disclosing precheck runs
        before the one-time consume — grant scope validation (400), grant
        usability (a bearer grant is a root self-grant: a non-root caller,
        deny-own-history policy, or missing grant capability is a loud 403,
        never a silent degrade to a metadata read), the original-retention
        gate for payload.read_originals (403/503), and the row read that
        decides 404/500 (a discarded pre-consume read). Each of these denials
        leaves the grant unconsumed and returns no payload bytes. The atomic
        consume is the last step before the 200 commit and the grant is never
        restored; every failed consume (invalid, expired, revoked,
        wrong-scope, bound to a different request or organization, already
        consumed, or grant store unavailable) answers the same generic 403
        with zero payload bytes — the pre-consume read is discarded, so
        invalid and replayed grants are deliberately indistinguishable (no
        consume/no-consume oracle). Once the 200 has begun the attempt is
        final: this is a single JSON document with no trailer, so a failure
        after the consume can only truncate the body — the token stays
        consumed, nothing is re-served, and no automatic refund exists. The
        grant is single-use across BOTH redemption surfaces (this detail
        endpoint and the request export stream): whichever redeems first
        burns it for both, and a replay gets the same generic 403 as an
        unknown grant. Every grant-relevant decision, allowed or denied, is
        journalled (identifiers and content flags only — never the token and
        never payload content).
      x-permission: org:requests.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: request_id, in: path, required: true, schema: { type: string } }
        - { name: payload_grant, in: query, description: Single-use request-bound bearer grant; alternatively send X-Request-Payload-Grant, schema: { type: string } }
        - { name: scope, in: query, description: Grant scope; payload.read_originals requires effective original retention, schema: { type: string, enum: [payload.read, payload.read_originals] } }
      responses:
        "200":
          description: >
            Request detail. For a redeemed grant the 200 commit is final: an
            encode/write failure after the consume can only truncate the body
            and the grant stays consumed (no refund, no re-serve).
        "400": { description: Invalid grant scope; a payload grant is not consumed }
        "403":
          description: >
            Fail-closed denial, one of: the payload grant cannot be used
            (non-root caller, deny-own-history policy, or no grant
            capability), original payload retention is disabled
            (payload.read_originals), or the payload grant is invalid,
            expired, revoked, wrong-scope, bound to a different request or
            organization, already consumed, or the grant store is unavailable.
            Invalid and consumed grants are deliberately indistinguishable
            (same generic body, no oracle), and a failed consume never falls
            back to a metadata-only read. No denial here consumes the grant
            and none returns payload bytes. Every denial is journalled.
        "404":
          description: >
            The row is missing or not visible to the caller (cross-org
            requests are indistinguishable — no existence oracle). Decided by
            a pre-consume read: a payload grant is NOT consumed and may be
            redeemed once a visible target exists.
        "500":
          description: >
            Request store failure on the pre-consume row read. A payload
            grant is NOT consumed — the redemption may be retried once the
            store recovers.
        "503": { description: Original retention setting unavailable (payload.read_originals); a payload grant is not consumed }
  /api/root/payload-grants:
    post:
      summary: Issue an audited, one-use request payload grant
      operationId: createRootRequestPayloadGrant
      x-permission: root
      description: >
        Issues a single-use bearer grant bound to one (org, request, scope).
        The grant is redeemable on exactly ONE surface overall — the request
        export stream or the request detail endpoint; whichever redeems first
        burns it for both. Redemption is fail-closed: any denial before the
        response starts (400/403/413/500/503, including store errors and the
        export row cap) leaves the grant unconsumed and journalled; a grant is
        consumed only by the atomic consume immediately before a 200 response
        is committed, and a consumed grant is never restored or refunded.
        One rare audited edge (C1): the atomic consume commits before the
        mandatory request_payload.grant_used audit insert, so a redeeming
        call can answer a generic 403 with the grant already spent; replay
        stays safe — the spent grant keeps answering the same generic 403 on
        both surfaces and never discloses payload bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, request_id, ttl_seconds]
              properties:
                org_id: { type: string }
                request_id: { type: string }
                ttl_seconds: { type: integer, minimum: 1, maximum: 900 }
                scope: { type: string, enum: [payload.read, payload.read_originals], default: payload.read }
      responses:
        "201": { description: Single-use bearer grant issued after durable audit }
        "400": { description: Invalid grant request }
        "403": { description: Root access required }
        "503": { description: Grant store or durable audit unavailable }

