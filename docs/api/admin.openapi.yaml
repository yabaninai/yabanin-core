    post:
      summary: Add an org member
      operationId: createOrgMember
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "201": { description: Member added } }
  /api/organizations/{id}/members/{userID}:
    put:
      summary: Update an org member's role
      operationId: updateOrgMember
      x-permission: org:members.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
