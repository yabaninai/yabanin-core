              schema: { $ref: "#/components/schemas/OrgRegionState" }
        "503": { description: Database not configured }
    put:
      summary: 'Upsert the org home-region assignment. Concurrency: one atomic single-statement upsert — concurrent writers serialize on the row lock, last write wins; no optimistic-concurrency token (intentional, single-owner setting)'
      operationId: updateOrgRegion
      x-permission: root
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgRegionUpdate" }
      responses:
        "200": { description: "Applied: {ok: true}" }
        "400": { description: Malformed JSON body }
