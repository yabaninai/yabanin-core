        - { name: period, in: query, schema: { type: string, default: 24h } }
      responses: { "200": { description: Provider health rows } }
  /api/units/spend:
    get:
      summary: Per-unit spend rollup (credits plus USD) for an org over the RFC3339 window; analytics.read member or root
      operationId: getUnitsSpend
      x-permission: session
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses: { "200": { description: Unit spend rows with the credits scale annotation } }
  /api/budgets:
    get:
      summary: Budget caps status (grace floor, output cap, reservations mode) with optional carbon grams override; budgets.manage member or root
      operationId: getBudgetCapsStatus
      x-permission: session
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
        - { name: carbon_budget_grams, in: query, schema: { type: number, format: double } }
      responses: { "200": { description: Budget caps status } }
  /api/credits/ledger:
    get:
      summary: Credits ledger view (server-clamped limit) for an org; budgets.manage member or root
      operationId: getCreditsLedgerView
      x-permission: session
      parameters:
        - { name: org_id, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { "200": { description: Credits ledger entries with the credits scale annotation } }
  /api/rates/catalog:
    get:
      summary: Committed reference rates catalog citation (version, generated time, digest) with the inline catalog
      operationId: getRatesCatalog
      x-permission: session
      responses: { "200": { description: Reference rates catalog citation and body } }
  /api/rates/diff:
    post:
      summary: Diff a candidate sealed rates pack against the committed catalog (dry run; no mutation, no journal)
      operationId: postRatesDiff
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack]
              properties:
                pack: { type: string, description: full sealed reference pack JSON }
                reason: { type: string }
      responses:
        "200": { description: Diff report with review flags and counts }
        "400": { description: Malformed body or invalid pack }
        "422": { description: Diff refused by review gates; report attached }
  /api/rates/promote:
    post:
      summary: Promote a candidate sealed rates pack (root session only, reason mandatory, chain-verified, journal-audited)
      operationId: postRatesPromote
      x-permission: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack, reason]
              properties:
                pack: { type: string, description: full sealed reference pack JSON }
                reason: { type: string, description: free-text justification recorded in the audit journal }
      responses:
        "200": { description: Promotion applied (before, after, rendered diff) }
        "400": { description: Missing reason, malformed body, invalid pack or broken chain }
        "403": { description: Root session required }
        "422": { description: Promotion refused by review gates; refusal is journal-audited }
