# Skip registry (NEXT-07): every test skip must be explained here.
# A skip not listed in this file causes the quality run to fail.
# Schema: v1 (2026-09-14).
#
# Fields:
#   test:    Go test name as "package_path.TestName"
#   condition: when the skip fires (always, or a runtime predicate)
#   reason:  why the unit test does not cover this behavior
#   class:   residue class of the skip (e.g. ENVIRONMENT = env/stand-gated by
#            design; informational, mirrors the registry classification)
#   refs:    registry/manifest evidence of where the skip was flagged; proves
#            the entry is a registered owner decision, never a bare silence
#   owner:   who decided this skip is acceptable
#   proof:   alternative evidence that the behavior IS verified
#   expires: empty = permanent; YYYY-MM-DD = temporary exception

