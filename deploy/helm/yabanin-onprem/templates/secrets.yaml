{{- /* N11-P02-T03 secret injection: an operator can point every consumer at
     pre-existing Secrets (existingSecret) instead of chart-rendered ones.
     Precedence is fail-closed: existingSecret set => inline `secrets.*`
     values for that group MUST be empty, so there is never ambiguity about
     which source wins. Workloads resolve names via
     yabanin.onprem.{app,kek,license}SecretName helpers. */}}
{{- if and .Values.secrets.existingSecret (or .Values.secrets.pg_uri .Values.secrets.cache_hmac_secret .Values.secrets.encryption_key .Values.secrets.session_key .Values.secrets.pg_password) }}
{{- fail "secrets.existingSecret is set: inline secrets.pg_uri/cache_hmac_secret/encryption_key/session_key/pg_password must be empty — the operator-managed Secret wins (remove the inline values)" }}
{{- end }}
{{- if and .Values.kms.existingSecret .Values.secrets.kek }}
{{- fail "kms.existingSecret is set: inline secrets.kek must be empty — the operator-managed Secret wins (remove the inline value)" }}
{{- end }}
{{- if and .Values.license.existingSecret .Values.secrets.license }}
{{- fail "license.existingSecret is set: inline secrets.license must be empty — the operator-managed Secret wins (remove the inline value)" }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
# pg_uri, cache_hmac_secret, encryption_key, session_key for gateway/admin
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "yabanin.fullname" . }}-secrets
  labels:
    {{- include "yabanin.labels" . | nindent 4 }}
type: Opaque
data:
  pg_uri: {{ default "" .Values.secrets.pg_uri | b64enc }}
  cache_hmac_secret: {{ default "" .Values.secrets.cache_hmac_secret | b64enc }}
  encryption_key: {{ default "" .Values.secrets.encryption_key | b64enc }}
  session_key: {{ default "" .Values.secrets.session_key | b64enc }}
  {{- /* Deterministic when the operator provides it; random only on first
        install otherwise (a re-roll would desync from an initialized PVC). */}}
  pg_password: {{ default (randAlphaNum 32) .Values.secrets.pg_password | b64enc }}
{{- end }}
---
# KMS encryption key (KEK) for per-org field-level encryption
{{- if not .Values.kms.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "yabanin.fullname" . }}-kek
  labels:
    {{- include "yabanin.labels" . | nindent 4 }}
type: Opaque
data:
  kek: {{ default "" .Values.secrets.kek | b64enc }}
{{- end }}
---
# Onprem license token for commercial deployment
{{- if not .Values.license.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "yabanin.fullname" . }}-license
  labels:
    {{- include "yabanin.labels" . | nindent 4 }}
type: Opaque
data:
  license: {{ default "" .Values.secrets.license | b64enc }}
{{- end }}
