{{- /* N11-P02-T03: same fake-HA guard as the cloud chart — ha.enabled=true
     with a single-replica gateway or admin would render an HA profile that
     dies with one node loss (deploy/helm/yabanin/HA-TOPOLOGY.md). */}}
{{- if .Values.ha.enabled }}
{{- if or (lt (int .Values.gateway.replicas) 2) (lt (int .Values.admin.replicas) 2) }}
{{- fail (printf "ha.enabled=true requires at least 2 replicas for gateway AND admin (gateway.replicas=%v, admin.replicas=%v); the documented HA topology spreads one node-loss failure domain per replica (deploy/helm/yabanin/HA-TOPOLOGY.md)" .Values.gateway.replicas .Values.admin.replicas) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "yabanin.fullname" . }}-gateway
  labels:
    {{- include "yabanin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: gateway
          image: "{{ .Values.image.repository | default "yabanin" }}:{{ .Values.image.tag }}"
          args: ["gateway"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 8082, name: http }
            - { containerPort: 9090, name: admin }
          envFrom:
            - configMapRef:
                name: {{ template "yabanin.fullname" . }}-config
          env:
            - { name: YABANIN_PG_URI_FILE, value: "/etc/yabanin/secrets/pg_uri" }
            - { name: YABANIN_CACHE_HMAC_SECRET_FILE, value: "/etc/yabanin/secrets/cache_hmac_secret" }
          volumeMounts:
            - name: secrets
              mountPath: /etc/yabanin/secrets
              readOnly: true
            - name: kek
              mountPath: {{ .Values.kms.kekPath }}/kek
              subPath: kek
              readOnly: true
            - name: license
              mountPath: {{ .Values.license.tokenPath }}/license
              subPath: license
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- if .Values.probes.gateway.readiness.enabled }}
          {{- include "yabanin.onprem.probe" (dict "style" "readinessProbe" "probe" .Values.probes.gateway.readiness) | nindent 10 }}
          {{- end }}
          {{- if .Values.probes.gateway.liveness.enabled }}
          {{- include "yabanin.onprem.probe" (dict "style" "livenessProbe" "probe" .Values.probes.gateway.liveness) | nindent 10 }}
          {{- end }}
          {{- if .Values.probes.gateway.startup.enabled }}
          {{- /* startupProbe gates liveness/readiness: a slow gateway start
                cannot be kill-looped by liveness before it ever served. */}}
          {{- include "yabanin.onprem.probe" (dict "style" "startupProbe" "probe" .Values.probes.gateway.startup) | nindent 10 }}
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
      {{- /* soft anti-affinity in every profile; the HARD failure-domain
            spread is added by ha.enabled below (N11-P02-T02/T03) */}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - gateway
                topologyKey: kubernetes.io/hostname
      {{- if .Values.ha.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.ha.topology_key }}
          whenUnsatisfiable: {{ .Values.ha.when_unsatisfiable }}
          labelSelector:
            matchLabels:
              app: gateway
      {{- end }}
      volumes:
        - name: secrets
          secret: { secretName: {{ include "yabanin.onprem.appSecretName" . }} }
        - name: kek
          secret: { secretName: {{ include "yabanin.onprem.kekSecretName" . }} }
        - name: license
          secret: { secretName: {{ include "yabanin.onprem.licenseSecretName" . }} }
        - name: tmp
          emptyDir: {}
