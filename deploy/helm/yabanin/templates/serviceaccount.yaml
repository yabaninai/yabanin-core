apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-yabanin
  labels:
    app: yabanin
automountServiceAccountToken: false
{{- if .Values.pdb.gateway.enabled }}
---
# previously read `app: yabinin` while gateway pods are labeled
# `app: yabinin-gateway` (gateway-deployment.yaml), so the PDB matched ZERO
# pods and protected nothing. maxUnavailable (not minAvailable) keeps node
# drains possible for 1-replica overlay profiles while still capping
# voluntary disruption at one pod for the HA base profile (replicaCount 2).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-gateway-pdb
  labels:
    app: yabinin-gateway
spec:
  maxUnavailable: {{ .Values.pdb.gateway.maxUnavailable }}
  selector:
    matchLabels:
      app: yabinin-gateway
{{- end }}
{{- if .Values.pdb.admin.enabled }}
---
# 1-replica admin Deployment blocked EVERY voluntary eviction (node drains
# hung forever). maxUnavailable keeps drains possible at any replica count.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-admin-pdb
  labels:
    app: yabinin-admin
spec:
  maxUnavailable: {{ .Values.pdb.admin.maxUnavailable }}
  selector:
    matchLabels:
      app: yabinin-admin
{{- end }}

