apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: yabinin
type: Opaque
data:
  pg_uri: {{ default "" .Values.secrets.pg_uri | b64enc }}
  cache_hmac_secret: {{ default "" .Values.secrets.cache_hmac_secret | b64enc }}
  encryption_key: {{ default "" .Values.secrets.encryption_key | b64enc }}
  session_key: {{ default "" .Values.secrets.session_key | b64enc }}
  kms_local_key: {{ default "" .Values.secrets.kms_local_key | b64enc }}
